# Pi SDR Academy — Dojos (pwn.college-style progression)
# Core dojos unlock belts in order. Side quests are optional parallel tracks.

intro: |
  You have entered the Pi SDR Academy DOJO — an offline lab for learners to
  develop systems, DSP, and software-defined radio skills hands-on.

  You begin with a white belt. From here you deepen into the terminal, the
  CPU, and the radio spectrum. Your companion is the blinking cursor: practice,
  earn belts, and eventually restore the signal.

rules: |
  These challenges are educational material first. Prefer learning over
  spoilers — keep writeups private when this lab is used for a class.

core:
  - id: intro-lab
    title: Intro to the Lab
    belt: white
    belt_label: White Belt
    tagline: Terminal, filesystem, and first flags on the Pi.
    modules:
      - orientation
      - linux-cli

  - id: software-craft
    title: Software Craft
    belt: yellow
    belt_label: Yellow Belt
    tagline: Python, C/C++, debug, build, and git as daily weapons.
    modules:
      - python
      - c
      - debugging-gdb
      - cpp
      - cmake
      - git-workflow

  - id: systems-core
    title: Systems Core
    belt: orange
    belt_label: Orange Belt
    tagline: Processes, IPC, sockets, and how machines actually run code.
    modules:
      - systems-programming
      - computer-architecture

  - id: dsp-foundations
    title: DSP Foundations
    belt: green
    belt_label: Green Belt
    tagline: Sampling, spectra, and filters — the math behind the radio.
    modules:
      - dsp-fundamentals
      - fft
      - dsp-filters

  - id: radio-path
    title: Radio Path
    belt: blue
    belt_label: Blue Belt
    tagline: IQ, GNU Radio, BPSK/QPSK, pulse shaping, and sync loops.
    modules:
      - iq-sdr
      - gnu-radio
      - bpsk
      - qpsk
      - pulse-shaping
      - synchronization

  - id: receivers-security
    title: Receivers & Radio Security
    belt: purple
    belt_label: Purple Belt
    tagline: Full receivers, protocol RE, and SDR security CTFs.
    modules:
      - complete-receivers
      - protocol-re
      - sdr-security-ctf

  - id: blackout
    title: Capstone — Blackout
    belt: black
    belt_label: Black Belt
    tagline: End-to-end recovery when the signal goes dark.
    modules:
      - capstone-blackout

side_quests:
  - id: language-qualification
    title: Language Qualification
    belt: brown
    belt_label: Brown Belt
    tagline: Optional depth — Python, modern C++, and GNU Radio C++ craft.
    modules:
      - python-qualification
      - cpp-qualification
      - gnuradio-cpp
