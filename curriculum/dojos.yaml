intro: >
  Welcome — no Linux experience needed. This offline lab teaches the terminal
  gently, then grows into radio. Ninety-four short challenges across core belts
  plus qualification side paths. Your progress is saved on your own git branch.
rules: >
  Start with White Belt. Read README.txt in each challenge. Take a hint when
  stuck. Core belts unlock in order. Qualification side paths can be browsed anytime.
core:
- id: intro-lab
  title: Intro to the Lab
  belt: white
  belt_label: White Belt
  tagline: First terminal steps, files, and saving progress with git.
  modules:
  - orientation
  - linux-cli
  - git-progress
- id: software-craft
  title: Software Craft
  belt: yellow
  belt_label: Yellow Belt
  tagline: Python and C as daily tools.
  modules:
  - python
  - c
- id: systems-core
  title: Systems Core
  belt: orange
  belt_label: Orange Belt
  tagline: Debug, systems, processes, and threads.
  modules:
  - debugging-gdb
  - systems-programming
  - process-threads
- id: dsp-foundations
  title: DSP Foundations
  belt: green
  belt_label: Green Belt
  tagline: Sinusoids, spectra, and the FFT.
  modules:
  - dsp-fundamentals
  - fft
- id: radio-path
  title: Radio Path
  belt: blue
  belt_label: Blue Belt
  tagline: IQ captures and BPSK.
  modules:
  - iq-sdr
  - bpsk
side_quests:
- id: python-qualification
  title: Python Qualification
  belt: yellow
  belt_label: Yellow Belt
  tagline: Modules through typing — offline SDR-lab remix of the Python syllabus.
  modules:
  - python-qualification
- id: cpp-qualification
  title: C++ Qualification
  belt: orange
  belt_label: Orange Belt
  tagline: Namespaces through ISR flags — offline remix of the C++ syllabus.
  modules:
  - cpp-qualification
- id: flowgraph-qualification
  title: Flowgraph Qualification
  belt: green
  belt_label: Green Belt
  tagline: Blocks, edges, vectors, tone chain — GNU Radio ideas without GNU Radio.
  modules:
  - flowgraph-qualification
