intro: >
  Welcome — no Linux experience needed. This offline lab teaches the terminal
  gently, then grows into radio. Fifty-eight short challenges. Five belts.
  Your progress is saved automatically on your own git branch.
rules: >
  Start with White Belt. Read README.txt in each challenge. Take a hint when
  stuck. Belts unlock in order. Progress auto-saves to git — you will learn how.
core:
- id: intro-lab
  title: Intro to the Lab
  belt: white
  belt_label: White Belt
  tagline: First terminal steps, files, and saving progress with git.
  modules:
  - orientation
  - linux-cli
  - git-progress
- id: software-craft
  title: Software Craft
  belt: yellow
  belt_label: Yellow Belt
  tagline: Python and C as daily tools.
  modules:
  - python
  - c
- id: systems-core
  title: Systems Core
  belt: orange
  belt_label: Orange Belt
  tagline: Debug, systems, processes, and threads.
  modules:
  - debugging-gdb
  - systems-programming
  - process-threads
- id: dsp-foundations
  title: DSP Foundations
  belt: green
  belt_label: Green Belt
  tagline: Sinusoids, spectra, and the FFT.
  modules:
  - dsp-fundamentals
  - fft
- id: radio-path
  title: Radio Path
  belt: blue
  belt_label: Blue Belt
  tagline: IQ captures and BPSK.
  modules:
  - iq-sdr
  - bpsk
side_quests: []
