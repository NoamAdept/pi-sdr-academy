id: py-file-parser
module: python
title: Parse a Receiver Configuration
difficulty: easy
estimated_time: 30-45 minutes
prerequisites:
- py-control-flow
objectives:
- file-io
- string-parsing
- exceptions
mastery_evidence:
- understand
- observe
- apply
description: 'Complete a small configuration parser. Blank lines and lines

  starting with `#` are ignored. Other lines are `name = value`; surrounding

  spaces are removed. Reject a non-comment line without `=` by raising

  `ValueError`. Running the script writes sorted `name=value` lines to

  `parsed.txt`.

  '
environment:
  type: workspace
  workspace_subdir: py-file-parser
  notes: Software-only; any networking stays on localhost.
files:
- README.txt
- receiver.conf
- parse_config.py
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{parsers_make_text_useful}
  validation: session
hints:
- level: 1
  text: 'Loop over the file object and call `strip()` on each line.

    '
- level: 2
  text: 'Use `line.split(''='', 1)` so a value may itself contain `=`.

    '
- level: 3
  text: 'Sort the dictionary keys when writing parsed.txt.

    '
solution: 'Ignore empty/comment lines, check for `=`, split once, strip both

  pieces, and assign `result[key] = value`. The main block can iterate over

  `sorted(config)` to produce deterministic output.

  '
explanation: 'Parsing separates syntax from meaning. Normalizing whitespace

  makes several human-friendly spellings equivalent, while rejecting malformed

  lines prevents a silent wrong configuration.

  '
extension:
  title: Go further
  description: 'Change the input data and make your solution handle the new case without

    changing its output format.

    '
performance_notes: 'Inputs are intentionally tiny and run comfortably on a Raspberry
  Pi.

  '
optional_hardware: []
