id: py-auto-investigator
module: python
title: Automate a Signal Investigation
difficulty: medium
estimated_time: 55-80 minutes
prerequisites:
- py-protocol-parser
objectives:
- csv
- data-analysis
- json
mastery_evidence:
- understand
- observe
- apply
description: 'Complete `investigate.py` to analyze observations from a CSV.

  Ignore rows whose status is not `LOCKED`. Group the rest by station. Report only

  stations seen at least three times, with count and average SNR rounded to one

  decimal. Write deterministic JSON sorted by station. The checker supplies a

  different dataset, so derive every result from the input.

  '
environment:
  type: workspace
  workspace_subdir: py-auto-investigator
  notes: Software-only; any networking stays on localhost.
files:
- README.txt
- observations.csv
- investigate.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{automation_makes_evidence_repeatable}
  validation: session
hints:
- level: 1
  text: 'Use `csv.DictReader` and a dictionary mapping station to a list of SNR values.

    '
- level: 2
  text: 'Filter on status before adding a value.

    '
- level: 3
  text: '`json.dump(..., sort_keys=True, indent=2)` produces stable, readable output.

    '
solution: 'Read each row, append `float(row[''snr''])` for LOCKED records, then

  build a result only for lists of length three or more. Each value is

  `{''count'': len(values), ''average_snr'': round(sum(values)/len(values), 1)}`.

  Dump with sorted keys.

  '
explanation: 'Automation makes an investigation repeatable: the same explicit

  filtering, grouping, and threshold rules apply to every dataset. Structured

  JSON also makes the result easy for another program or a person to consume.

  '
extension:
  title: Go further
  description: 'Change the input data and make your solution handle the new case without

    changing its output format.

    '
performance_notes: 'Inputs are intentionally tiny and run comfortably on a Raspberry
  Pi.

  '
optional_hardware: []
