id: cpp-qualification
slug: cpp-qualification
title: C++ Qualification Topics
order: 23
description: |
  Covers professional C++ qualification topics — namespaces/const, strings/files,
  modern C++, templates, errors/optional, low-level bits, concurrency/ISR
  simulation, and offline dependencies.

  Prior coverage: CMake is covered in Module 6, RAII and smart pointers in
  Module 5, and the STL in cpp-stl. Dependency exercises here use offline
  vendoring instead of online vcpkg.
prerequisites:
  - cpp
  - cmake
challenges:
  - cppq-namespaces-const
  - cppq-strings-files
  - cppq-modern-cpp
  - cppq-templates
  - cppq-errors-optional
  - cppq-lowlevel-concurrency
