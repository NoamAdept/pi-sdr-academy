id: cppq-strings-files
module: cpp-qualification
title: "Parse and Persist a Radio Config"
difficulty: easy
estimated_time: "45-65 minutes"

prerequisites:
  - cppq-namespaces-const

objectives:
  - std-string-operations
  - file-streams
  - offline-dependency-practice

mastery_evidence:
  - understand
  - implement
  - apply

description: |
  Complete a key/value configuration parser using `std::string`, `std::ifstream`,
  and `std::ofstream`. Normalize a station name, save it, load it, and extract a
  token from the resulting config. Everything must work without network access.

environment:
  type: workspace
  workspace_subdir: cppq-strings-files
  notes: Offline only; dependencies must be committed under vendor/ rather than fetched with vcpkg.

files:
  - README.md
  - config.cpp
  - check

expected_tools:
  - bash
  - g++

flags:
  value: "flag{streams_keep_configs_offline}"
  validation: session

hints:
  - level: 1
    text: Use `find('=')` and `substr` to split each non-empty line.
  - level: 2
    text: Check each stream immediately after opening it.
  - level: 3
    text: Normalize by replacing spaces with underscores and converting letters with `std::tolower`.

solution: |
  Normalize the input string, write `station=<value>` and `token=<value>` lines,
  parse each line at the first equals sign, and print the loaded token.

explanation: |
  Standard strings and file streams provide portable ownership, parsing, and
  persistence. Vendoring required source makes builds reproducible on the
  academy's offline Pi.

extension:
  title: "Reject malformed input"
  description: Detect duplicate keys and lines without an equals sign.

performance_notes: Uses only the C++17 standard library and tiny text files.
optional_hardware: []
