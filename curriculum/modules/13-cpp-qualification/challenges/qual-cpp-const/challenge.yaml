id: qual-cpp-const
module: cpp-qualification
title: Const Gain Path
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-oop
objectives:
- const
- qualifiers
mastery_evidence:
- understand
- apply
description: |
  scale_const takes a const int& sample and a gain. Return sample * gain without assigning through the const reference, and print scaled=6. const documents read-only paths through a DSP stage.
environment:
  type: workspace
  workspace_subdir: qual-cpp-const
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_const}
  validation: session
hints:
- level: 1
  text: |
    Return sample * gain.
- level: 2
  text: |
    Do not write to sample — it is const.
- level: 3
  text: |
    Keep the const int& parameter type.
solution: |
  return sample*gain
explanation: |
  const references pass large values cheaply while promising not to mutate them.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
