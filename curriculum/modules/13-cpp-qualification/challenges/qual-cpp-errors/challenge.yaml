id: qual-cpp-errors
module: cpp-qualification
title: Throw on Bad Gain
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-raii
objectives:
- exceptions
mastery_evidence:
- understand
- apply
description: |
  apply_gain throws std::invalid_argument on negative gain. Keep the throw, print ok=8 for a good call, then catch the bad call and print caught. Exceptions make unsafe operator input visible instead of returning magic codes.
environment:
  type: workspace
  workspace_subdir: qual-cpp-errors
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_errors}
  validation: session
hints:
- level: 1
  text: |
    The throw on gain < 0 is already written — keep it.
- level: 2
  text: |
    Good path should print ok= followed by the product.
- level: 3
  text: |
    catch (const std::invalid_argument&) should print caught.
solution: |
  throw invalid_argument
explanation: |
  Throwing on bad gain stops silent corruption of the signal path.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
