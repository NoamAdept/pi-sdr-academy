id: qual-cpp-bits
module: cpp-qualification
title: Pack Big-Endian ID
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-packages
objectives:
- bit-manipulation
mastery_evidence:
- understand
- apply
description: |
  Split uint16 0xABCD into big-endian high and low bytes and print hex=abcd. Shifts and masks build beacon headers and protocol fields the same way embedded radio firmware does.
environment:
  type: workspace
  workspace_subdir: qual-cpp-bits
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_bits}
  validation: session
hints:
- level: 1
  text: |
    High byte is (id >> 8) & 0xFF.
- level: 2
  text: |
    Low byte is id & 0xFF.
- level: 3
  text: |
    Print both nibbles in hex after hex=.
solution: |
  hi/lo bytes
explanation: |
  Bit ops let you lay out multi-byte IDs without depending on host endianness.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
