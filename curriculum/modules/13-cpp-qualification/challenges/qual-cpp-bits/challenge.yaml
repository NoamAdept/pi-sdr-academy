id: qual-cpp-bits
module: cpp-qualification
title: Pack Big-Endian ID
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-packages
objectives:
- bit-manipulation
mastery_evidence:
- understand
- apply
description: |
  Pack uint16 0xABCD as big-endian bytes and print hex=abcd.
environment:
  type: workspace
  workspace_subdir: qual-cpp-bits
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_bits}
  validation: session
hints:
- level: 1
  text: |
    shift 8
- level: 2
  text: |
    mask 0xFF
- level: 3
  text: |
    hex out
solution: |
  hi/lo bytes
explanation: |
  Bit ops build beacon headers.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
