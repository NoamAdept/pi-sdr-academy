id: qual-cpp-oop
module: cpp-qualification
title: Tone Synthesizer Class
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-data
objectives:
- oop
- classes
mastery_evidence:
- understand
- apply
description: |
  Tone stores a frequency in Hz behind a private field. Finish freq() so it returns hz_ and main prints freq=440. Classes encapsulate synthesizer state the way real tone blocks hide their internals.
environment:
  type: workspace
  workspace_subdir: qual-cpp-oop
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_oop}
  validation: session
hints:
- level: 1
  text: |
    freq() should return the private hz_ member.
- level: 2
  text: |
    Keep the method const — it only reads state.
- level: 3
  text: |
    return hz_;
solution: |
  return hz_
explanation: |
  Encapsulation keeps signal state private and exposes a small public API.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
