id: qual-cpp-concurrency
module: cpp-qualification
title: Thread the Increment
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-templates
objectives:
- threads
- concurrency
mastery_evidence:
- understand
- apply
description: |
  A worker thread sets ready=1. Join that thread before reading ready, then print ready=1. Joining is the handshake that makes shared state safe to observe after a background IQ worker finishes.
environment:
  type: workspace
  workspace_subdir: qual-cpp-concurrency
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_concurrency}
  validation: session
hints:
- level: 1
  text: |
    Call t.join() before printing.
- level: 2
  text: |
    The lambda already sets ready = 1.
- level: 3
  text: |
    Do not read ready until after join.
solution: |
  join before print
explanation: |
  join waits for the thread; reading shared state earlier is a race.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
