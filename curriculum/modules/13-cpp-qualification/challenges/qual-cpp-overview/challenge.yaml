id: qual-cpp-overview
module: cpp-qualification
title: C++ Qualification Map
difficulty: easy
estimated_time: 10-15 minutes
prerequisites: []
objectives:
- orientation
mastery_evidence:
- understand
description: |
  Read OVERVIEW.txt for the C++ qualification map and write the track id `cpp-qualification` into answer.txt on one line. Overview first — then namespaces through ISR-style flags in the challenges that follow.
environment:
  type: workspace
  workspace_subdir: qual-cpp-overview
  notes: Offline overview challenge from the qualification syllabus.
files:
- README.txt
- OVERVIEW.txt
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_cpp_overview}
  validation: session
hints:
- level: 1
  text: |
    Read OVERVIEW.txt; it names the track.
- level: 2
  text: |
    One line in answer.txt with the track id.
- level: 3
  text: |
    Exact spelling: cpp-qualification
solution: |
  Write cpp-qualification into answer.txt
explanation: |
  The overview challenge mirrors the syllabus notebook and unlocks the path id.
extension:
  title: Skim next
  description: |
    Browse the next challenge in this module.
