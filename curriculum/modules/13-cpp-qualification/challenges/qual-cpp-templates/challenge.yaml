id: qual-cpp-templates
module: cpp-qualification
title: Template Max Sample
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-bits
objectives:
- templates
mastery_evidence:
- understand
- apply
description: |
  Finish the max_sample template so it returns the larger of two values and main prints max=9. Templates generic-ize DSP helpers across int, float, and other sample types without copy-paste.
environment:
  type: workspace
  workspace_subdir: qual-cpp-templates
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_templates}
  validation: session
hints:
- level: 1
  text: |
    Compare a and b; return the larger.
- level: 2
  text: |
    A ternary works: (a > b) ? a : b
- level: 3
  text: |
    Keep the template <typename T> signature.
solution: |
  return a>b?a:b
explanation: |
  One template serves many numeric types — generic programming for radio math.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
