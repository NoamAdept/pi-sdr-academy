id: qual-cpp-cmake
module: cpp-qualification
title: CMake-Style Target Name
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-errors
objectives:
- cmake
- build-systems
mastery_evidence:
- understand
- apply
description: |
  Pretend your CMake target is named beacon_rx. Print target=beacon_rx from main. Build systems name radio binaries; this challenge only checks you can treat that name as a first-class constant in code.
environment:
  type: workspace
  workspace_subdir: qual-cpp-cmake
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_cmake}
  validation: session
hints:
- level: 1
  text: |
    Store the string beacon_rx in a std::string.
- level: 2
  text: |
    Print target= then the string.
- level: 3
  text: |
    Spelling must be exactly beacon_rx.
solution: |
  print target
explanation: |
  CMake targets name the artifacts operators run — keep those names consistent.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
