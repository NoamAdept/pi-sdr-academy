id: qual-cpp-isr
module: cpp-qualification
title: ISR Flag Handshake
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-concurrency
objectives:
- isr
- volatile
mastery_evidence:
- understand
- apply
description: |
  volatile irq_flag set by pretend ISR; main prints irq=1.
environment:
  type: workspace
  workspace_subdir: qual-cpp-isr
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_isr}
  validation: session
hints:
- level: 1
  text: |
    volatile already
- level: 2
  text: |
    call pretend_isr
- level: 3
  text: |
    print irq=
solution: |
  volatile flag
explanation: |
  volatile for ISR-shared flags.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
