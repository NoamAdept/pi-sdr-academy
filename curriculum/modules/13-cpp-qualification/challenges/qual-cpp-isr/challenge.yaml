id: qual-cpp-isr
module: cpp-qualification
title: ISR Flag Handshake
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-concurrency
objectives:
- isr
- volatile
mastery_evidence:
- understand
- apply
description: |
  irq_flag is volatile and set by pretend_isr. Call the ISR stub and print irq=1. volatile tells the compiler a hardware or interrupt path may change the flag outside normal control flow.
environment:
  type: workspace
  workspace_subdir: qual-cpp-isr
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_isr}
  validation: session
hints:
- level: 1
  text: |
    Keep the volatile qualifier on irq_flag.
- level: 2
  text: |
    Call pretend_isr() before printing.
- level: 3
  text: |
    Print irq= followed by the flag value.
solution: |
  volatile flag
explanation: |
  ISR-shared flags are volatile so reads are not optimized into stale registers.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
