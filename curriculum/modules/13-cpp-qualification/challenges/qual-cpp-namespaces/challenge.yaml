id: qual-cpp-namespaces
module: cpp-qualification
title: Namespace the Calculator
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-overview
objectives:
- namespaces
mastery_evidence:
- understand
- apply
description: |
  RadioMath already provides add inside a namespace. Finish sub so it returns a - b, and keep the program printing sum= and diff= via RadioMath::. Namespaces keep large radio codebases from colliding on short names.
environment:
  type: workspace
  workspace_subdir: qual-cpp-namespaces
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_namespaces}
  validation: session
hints:
- level: 1
  text: |
    Inside RadioMath::sub, return a - b.
- level: 2
  text: |
    Do not remove the RadioMath namespace wrapper.
- level: 3
  text: |
    main already prints with RadioMath::add and RadioMath::sub.
solution: |
  sub returns a-b
explanation: |
  Scope resolution (RadioMath::) reaches names inside a namespace without polluting the global scope.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
