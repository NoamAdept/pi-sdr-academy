id: qual-cpp-data
module: cpp-qualification
title: Tune File In C++
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-namespaces
objectives:
- strings
- fstream
mastery_evidence:
- understand
- apply
description: |
  Operator notes live in tune.txt. Read the first line with getline and print tune=<line> (for example tune=146.52). Strings and fstream are the everyday tools for lab configuration files on the Pi.
environment:
  type: workspace
  workspace_subdir: qual-cpp-data
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
- tune.txt
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_data}
  validation: session
hints:
- level: 1
  text: |
    tune.txt is already in the workspace.
- level: 2
  text: |
    std::getline(in, line) reads the first line.
- level: 3
  text: |
    Print exactly: tune= followed by the line contents.
solution: |
  getline + print
explanation: |
  ifstream + getline load text configs the same way operators keep tune cards.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
