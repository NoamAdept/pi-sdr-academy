id: qual-cpp-pointers
module: cpp-qualification
title: Pointer to the Sample
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-const
objectives:
- pointers
- references
mastery_evidence:
- understand
- apply
description: |
  sample starts at 0 and p points at it. Write 42 through the pointer (*p) so main prints value=42. Pointers address live sample memory — powerful and easy to misuse, which is why this qualification drills them early.
environment:
  type: workspace
  workspace_subdir: qual-cpp-pointers
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_pointers}
  validation: session
hints:
- level: 1
  text: |
    p already holds &sample.
- level: 2
  text: |
    Assign through the pointer: *p = 42;
- level: 3
  text: |
    Printing sample afterward should show 42.
solution: |
  *p=42
explanation: |
  A pointer holds an address; dereferencing it reads or writes the live object.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
