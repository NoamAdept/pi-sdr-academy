id: qual-cpp-modern
module: cpp-qualification
title: Auto and Range-For
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-pointers
objectives:
- modern-cpp
- auto
mastery_evidence:
- understand
- apply
description: |
  Sum a vector of gains with a range-based for loop and print sum=6. Modern C++ prefers range-for over index loops when you only need each element.
environment:
  type: workspace
  workspace_subdir: qual-cpp-modern
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_modern}
  validation: session
hints:
- level: 1
  text: |
    for (int g : gains) walks every element.
- level: 2
  text: |
    Add each g into sum.
- level: 3
  text: |
    Keep the final print of sum=.
solution: |
  range-for sum
explanation: |
  Range-for is clearer and less error-prone than manual indexing for simple scans.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
