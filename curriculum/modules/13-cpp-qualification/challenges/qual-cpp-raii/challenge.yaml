id: qual-cpp-raii
module: cpp-qualification
title: RAII File Guard
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-stl
objectives:
- raii
- smart-pointers
mastery_evidence:
- understand
- apply
description: |
  Own an int with std::unique_ptr (value 7) and print owned=7. RAII and smart pointers free resources when the owner leaves scope — the C++ answer to manual new/delete bugs in long-running radio processes.
environment:
  type: workspace
  workspace_subdir: qual-cpp-raii
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_raii}
  validation: session
hints:
- level: 1
  text: |
    std::make_unique<int>(7) builds an owning pointer.
- level: 2
  text: |
    Dereference with *p to read the value.
- level: 3
  text: |
    unique_ptr must appear in main.cpp.
solution: |
  unique_ptr owns int(7)
explanation: |
  When unique_ptr goes out of scope it deletes the object — no leak, no double-free.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
