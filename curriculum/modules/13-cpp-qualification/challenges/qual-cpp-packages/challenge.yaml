id: qual-cpp-packages
module: cpp-qualification
title: Vendored Header Include
difficulty: medium
estimated_time: 20-40 minutes
prerequisites:
- qual-cpp-cmake
objectives:
- packages
- headers
mastery_evidence:
- understand
- apply
description: |
  A local labkit.hpp sits beside main.cpp. Include it with quotes and print ver= from labkit_version(). Vendored headers are how small C++ packages ship helpers without a full system install.
environment:
  type: workspace
  workspace_subdir: qual-cpp-packages
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- main.cpp
- run
- check
- check.py
- labkit.hpp
expected_tools:
- g++
- python3
flags:
  value: flag{qual_cpp_packages}
  validation: session
hints:
- level: 1
  text: |
    #include "labkit.hpp"
- level: 2
  text: |
    Call labkit_version().
- level: 3
  text: |
    Print ver= followed by the returned int.
solution: |
  include local header
explanation: |
  Quoted includes pull headers from the project tree — the start of real packaging.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
