id: sys-pipes
module: systems-programming
title: Connect Parent and Child with a Pipe
difficulty: medium
estimated_time: 45-70 minutes
prerequisites:
- sys-file-descriptors
objectives:
- operating_system_apis
- error_handling
- resource_lifetimes
mastery_evidence:
- understand
- observe
- apply
description: 'A pipe is a one-way byte stream between processes.


  Your task: Complete pipe_demo.c so a child writes `samples=64` and its parent reads
  and prints it.


  Start with `./run`, read `README.md`, edit the starter files, and use

  `./check` whenever you want feedback. Everything runs in this one workspace;

  no hardware, network download, or remote Git repository is needed.

  '
environment:
  type: workspace
  workspace_subdir: sys-pipes
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.
files:
- README.md
- check
- pipe_demo.c
- run
expected_tools:
- cc
- python3
- ./run
- ./check
flags:
  value: flag{sys_pipes}
  validation: session
hints:
- level: 1
  text: 'Run `./run` first and read its output. Then inspect the starter file and
    README.

    '
- level: 2
  text: 'Work on one observable result at a time; rerun `./check` after each change.

    '
- level: 3
  text: 'Complete pipe_demo.c so a child writes `samples=64` and its parent reads
    and prints it.

    '
- level: 4
  text: 'The solution section names the key command or API if you need a final nudge.

    '
solution: 'Call pipe then fork. The child closes the read end and writes `samples=64`;
  the parent closes the write end, reads, prints, and waits.


  After making the change, run `./run` and then `./check`.

  '
explanation: 'The correct pipe ends are closed and communication completes. The checker
  validates behavior, not a particular editing style, so an

  equivalent correct implementation is accepted.

  '
extension:
  title: Change one parameter
  description: 'After earning the flag, change one input value, predict the result,
    and update

    your implementation so it remains correct rather than hard-coding the answer.

    '
