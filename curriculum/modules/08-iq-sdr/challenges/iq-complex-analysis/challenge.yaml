id: iq-complex-analysis
module: iq-sdr
title: Complex IQ Analysis
difficulty: easy
estimated_time: 20-40 minutes
prerequisites: []
objectives:
- inspect_iq_data
- implement_a_small_dsp_step
- verify_the_result
mastery_evidence:
- understand
- implement
- apply
description: "## Goal\nCompute mean power of the IQ capture.\n\n## Steps\n1. Read `README.txt`,\
  \ then run `./run`.\n2. Write `mean(abs(x)**2)` to `answer.txt` (tolerance \xB10.01).\n\
  3. Run `./check`, then press Done.\n"
environment:
  type: iq
  workspace_subdir: iq-complex-analysis
  notes: Fully offline, software-only, and sized for Raspberry Pi.
files:
- README.txt
- capture.iq
- check
- checker.py
- inspect_capture.py
- run
- sample_rate.txt
expected_tools:
- ./run
- ./check
- python3
- numpy
- scipy
flags:
  value: flag{complex_samples_encode_phase}
  validation: session
hints:
- level: 1
  text: Run ./run and inspect README.txt. Start with the printed sample count and spectrum.
- level: 2
  text: Load IQ with np.fromfile(..., dtype='<f4').reshape(-1, 2), then use a[:,0] + 1j*a[:,1].
- level: 3
  text: Use np.fft.fftfreq/fftshift for frequency; average all samples in one symbol before
    slicing.
- level: 4
  text: Build the solution one measured stage at a time; the instructor reference uses fewer
    than 25 lines of Python.
solution: 'The challenge''s hidden `solution/reference_solution.py` is executable

  documentation. Run it from a copy of the staged files, inspect the generated

  answer or output, and then run `./check`. It shows a compact NumPy/SciPy

  implementation and comments the important DSP operation.

  '
explanation: 'Measure magnitude, phase, and mean power. The key habit is to verify every stage
  numerically: inspect the

  spectrum, apply one operation, and measure again. This is the same workflow

  used for live SDR receivers, only with a short repeatable capture.

  '
extension:
  title: Stress the receiver
  description: Change one parameter in a copy of the generator or add noise, then find where
    your method fails.
performance_notes: Captures contain fewer than 200,000 complex float32 samples and checks
  normally finish in seconds.
optional_hardware: []
