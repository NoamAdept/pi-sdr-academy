id: gdb-find-variable
module: debugging-gdb
title: Find a Changing Variable
difficulty: easy
estimated_time: 30-45 minutes
prerequisites:
- gdb-first-breakpoint
objectives:
- gdb
- next
- print
mastery_evidence:
- understand
- observe
- apply
description: 'A loop adjusts `level` once per sample. Use GDB to break at

  `inspect_here`, continue until its fourth call, and inspect `level`. Put the

  decimal value in `answer.txt`.

  '
environment:
  type: workspace
  workspace_subdir: gdb-find-variable
  notes: Software-only; no external hardware or network required.
files:
- README.txt
- target.c
- run
- check
- check.py
expected_tools:
- bash
- gcc
- gdb
flags:
  value: flag{step_and_watch_state_change}
  validation: session
hints:
- level: 1
  text: 'Use `break inspect_here`, `run`, then `continue` three times.

    '
- level: 2
  text: 'GDB reports every breakpoint stop; count the initial stop as call one.

    '
- level: 3
  text: 'At the fourth stop enter `print level`.

    '
solution: 'Build and open the target in GDB. Break on `inspect_here`, run, then

  continue three times. Print `level` and place that integer in `answer.txt`.

  '
explanation: 'Repeated breakpoints let you observe a variable over time without

  adding temporary print statements. Continuing resumes execution until the next

  event of interest.

  '
extension:
  title: Go further
  description: 'Add one more test case of your own and confirm the program still behaves

    correctly.

    '
performance_notes: 'Sources and test data are intentionally small and compile quickly
  on a Raspberry Pi.

  '
optional_hardware: []
