id: gdb-follow-stack
module: debugging-gdb
title: Follow the Call Stack
difficulty: medium
estimated_time: 35-55 minutes
prerequisites:
- gdb-find-variable
objectives:
- gdb
- backtrace
- stack-frames
mastery_evidence:
- understand
- observe
- apply
description: 'Break at `capture` and use a backtrace to discover the route of

  function calls from `main` to that point. Write function names from outermost

  to innermost, joined by ` -> `, in `answer.txt`. Include `main` and `capture`.

  '
environment:
  type: workspace
  workspace_subdir: gdb-follow-stack
  notes: Software-only; no external hardware or network required.
files:
- README.txt
- target.c
- run
- check
- check.py
expected_tools:
- bash
- gcc
- gdb
flags:
  value: flag{backtraces_show_the_route}
  validation: session
hints:
- level: 1
  text: 'Use `break capture`, `run`, then `backtrace` (or `bt`).

    '
- level: 2
  text: 'Frame zero is the innermost function; the largest frame number is the outermost.

    '
- level: 3
  text: 'Reverse the displayed order when writing the answer.

    '
solution: 'At the capture breakpoint, run `bt`. Read the function name in each

  frame and write them in reverse frame-number order, from `main` through the

  intermediate functions to `capture`.

  '
explanation: 'Each active function call has a stack frame. A backtrace lists

  those frames from the current function outward, showing how execution reached

  the point where it stopped.

  '
extension:
  title: Go further
  description: 'Add one more test case of your own and confirm the program still behaves

    correctly.

    '
performance_notes: 'Sources and test data are intentionally small and compile quickly
  on a Raspberry Pi.

  '
optional_hardware: []
