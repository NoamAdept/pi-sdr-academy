id: gdb-segfault
module: debugging-gdb
title: Locate and Fix a Segmentation Fault
difficulty: medium
estimated_time: 45-70 minutes
prerequisites:
- gdb-inspect-memory
objectives:
- gdb
- segmentation-faults
- backtrace
mastery_evidence:
- understand
- observe
- apply
description: 'The program crashes while finding the largest sample. Use GDB''s

  backtrace and local variables to find the invalid access, then fix `target.c`.

  The repaired program must compile cleanly and print `largest=12`.

  '
environment:
  type: workspace
  workspace_subdir: gdb-segfault
  notes: Software-only; no external hardware or network required.
files:
- README.txt
- target.c
- run
- check
- check.py
expected_tools:
- bash
- gcc
- gdb
flags:
  value: flag{the_crash_frame_points_home}
  validation: session
hints:
- level: 1
  text: 'Run inside GDB and let it crash, then enter `bt`.

    '
- level: 2
  text: 'Use `frame 0`, `info locals`, and `print i` at the crash.

    '
- level: 3
  text: 'A loop processing `count` items must stop while `i < count`; also consider
    count zero.

    '
solution: 'Change the loop bound from `i <= count` to `i < count`. Handle an

  empty input before reading `values[0]` (the supplied main has nonempty input,

  but the checker tests the function safely through the program''s normal build).

  '
explanation: 'A segmentation fault means the process touched memory it was not

  allowed to access. The top stack frame identifies the active operation, while

  locals reveal the out-of-range index that caused it.

  '
extension:
  title: Go further
  description: 'Add one more test case of your own and confirm the program still behaves

    correctly.

    '
performance_notes: 'Sources and test data are intentionally small and compile quickly
  on a Raspberry Pi.

  '
optional_hardware: []
