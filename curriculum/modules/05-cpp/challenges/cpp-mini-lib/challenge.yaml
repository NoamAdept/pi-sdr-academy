id: cpp-mini-lib
module: cpp
title: "Finish a Mini Signal Library"
difficulty: medium
estimated_time: "55-85 minutes"

prerequisites:
  - cpp-smart-ptr

objectives:
  - headers
  - namespaces
  - library-design

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Finish a two-file mini library in namespace `signal`. Implement
  frequency validation and a channel plan that rejects duplicate names and
  invalid frequencies. The public header is fixed. A plan returns names ordered
  by ascending frequency, using name to break ties.

environment:
  type: workspace
  workspace_subdir: cpp-mini-lib
  notes: Software-only; no external hardware or network required.

files:
  - README.txt
  - include/signal/frequency.hpp
  - include/signal/channel_plan.hpp
  - frequency.cpp
  - channel_plan.cpp
  - check
  - check.py

expected_tools:
  - bash
  - g++
  - ar

flags:
  value: "flag{small_interfaces_make_reusable_libraries}"
  validation: session

hints:
  - level: 1
    text: |
      Keep implementation definitions inside `namespace signal { ... }`.
  - level: 2
    text: |
      A frequency is valid from 100000 through 6000000000 inclusive.
  - level: 3
    text: |
      Before adding, search existing entries for the same name; sort a copy in `ordered_names`.

solution: |
  Implement the inclusive range check. In `add`, reject invalid
  frequencies or an existing name, otherwise push an entry. Copy entries in
  `ordered_names`, sort with a comparator on frequency then name, and collect
  names.

explanation: |
  A header is a contract between a library and its users.
  Namespaces prevent unrelated names from colliding, while implementation files
  hide details that callers do not need.

extension:
  title: "Go further"
  description: |
    Add one more test case of your own and confirm the program still behaves
    correctly.

performance_notes: |
  Sources and test data are intentionally small and compile quickly on a Raspberry Pi.

optional_hardware: []
