id: cpp-debug-app
module: cpp
title: "Debug a C++ Receiver App"
difficulty: medium
estimated_time: "60-90 minutes"

prerequisites:
  - cpp-mini-lib

objectives:
  - cpp-debugging
  - iterators
  - exceptions

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  The receiver application should remove negative samples, compute
  the median, and print it. It currently has an iterator bug and an even-count
  median bug. Use `./run`, sanitizer output, GDB, and tests to repair `app.cpp`.
  It must print `median=7.0` and also handle other inputs correctly.

environment:
  type: workspace
  workspace_subdir: cpp-debug-app
  notes: Software-only; no external hardware or network required.

files:
  - README.txt
  - app.hpp
  - app.cpp
  - main.cpp
  - run
  - check
  - check.py

expected_tools:
  - bash
  - g++
  - gdb

flags:
  value: "flag{debuggers_and_tests_close_the_case}"
  validation: session

hints:
  - level: 1
    text: |
      Erasing a vector element invalidates the current iterator; `erase` returns the next valid iterator.
  - level: 2
    text: |
      After filtering, sort before selecting the middle.
  - level: 3
    text: |
      For an even number of items, average indexes `size/2 - 1` and `size/2` using floating-point division.

solution: |
  Use an iterator loop where the erase branch assigns
  `it = values.erase(it)` and the keep branch increments it. Sort after filtering.
  Return zero for empty input; use the center item for odd size and the average
  of the two center items for even size.

explanation: |
  Iterator invalidation is a common C++ bug: container changes can
  make stored positions unusable. Library return values document the safe next
  position. Tests around empty, odd, and even sizes expose boundary logic errors.

extension:
  title: "Go further"
  description: |
    Add one more test case of your own and confirm the program still behaves
    correctly.

performance_notes: |
  Sources and test data are intentionally small and compile quickly on a Raspberry Pi.

optional_hardware: []
