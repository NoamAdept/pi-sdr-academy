id: arch-disasm
module: computer-architecture
title: Read a Disassembly
difficulty: medium
estimated_time: "45-70 minutes"

prerequisites:
  - arch-stack

objectives:
  - machine_representation
  - compiler_output
  - runtime_observation

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Disassembly turns machine-code bytes back into assembly instructions.

  Your task: Build beacon, disassemble it with an available tool, and identify the constant returned by beacon_code.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: arch-disasm
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - answer.txt
  - beacon.c
  - check
  - run

expected_tools:
  - cc
  - assembly_or_disassembler
  - ./run
  - ./check

flags:
  value: "flag{arch_disasm}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Build beacon, disassemble it with an available tool, and identify the constant returned by beacon_code.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Inspect beacon_code in disassembly.txt and enter `constant=37` (hexadecimal 0x25).

  After making the change, run `./run` and then `./check`.

explanation: |
  A disassembly file exists and answer.txt records 37. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
