id: cli-text-extraction
module: linux-cli
title: Extract Frequencies from Text
difficulty: easy
estimated_time: 20-35 minutes
prerequisites:
- cli-pipeline
objectives:
- regular-expressions
- text-extraction
- unique-sorting
mastery_evidence:
- understand
- observe
- apply
description: 'A mixed operations bulletin contains ordinary text and radio

  frequencies. Extract every value written immediately before `MHz`, remove

  duplicates, sort numerically, and save one number per line in `frequencies.txt`.

  Keep the decimal spelling from the bulletin.

  '
environment:
  type: workspace
  workspace_subdir: cli-text-extraction
  notes: Software-only; any networking stays on localhost.
files:
- README.txt
- bulletin.txt
- check
- check.py
expected_tools:
- bash
- grep
- sort
flags:
  value: flag{regex_finds_the_signal}
  validation: session
hints:
- level: 1
  text: '`grep -o` prints only the matching part instead of the whole line.

    '
- level: 2
  text: 'An extended pattern such as `[0-9]+\.[0-9]+ MHz` finds these values.

    '
- level: 3
  text: 'Pipe through `cut -d'' '' -f1`, then `sort -n -u`.

    '
solution: 'Run:

  `grep -Eo ''[0-9]+\.[0-9]+ MHz'' bulletin.txt | cut -d'' '' -f1 | sort -n -u > frequencies.txt`

  and then `./check`.

  '
explanation: 'A regular expression describes the shape of text to find.

  `grep -Eo` extracts only matches, `cut` removes the unit, and `sort -n -u`

  sorts as numbers while removing repeated lines.

  '
extension:
  title: Go further
  description: 'Change the input data and make your solution handle the new case without

    changing its output format.

    '
performance_notes: 'Inputs are intentionally tiny and run comfortably on a Raspberry
  Pi.

  '
optional_hardware: []
