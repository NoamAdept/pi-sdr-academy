id: pyq-modules-packages
module: python-qualification
title: "Repair the Receiver Package"
difficulty: easy
estimated_time: "30-60 minutes"
prerequisites:
  - python
objectives:
  - organize_code_as_a_python_package
  - use_absolute_and_relative_imports
  - explain_init_files_and_virtual_environments
mastery_evidence: [understand, debug, implement]
description: |
  A tiny receiver application was split into a package, but its imports are
  broken. Repair the package exports and imports so the report runs offline.
environment:
  type: python
  workspace_subdir: pyq-modules-packages
files: [README.txt, analyze.py, radio_tools/__init__.py, radio_tools/levels.py, check]
expected_tools: [python3, ./check]
flags:
  value: "flag{pyq_packages_connect_cleanly}"
  validation: session
hints:
  - {level: 1, text: "Run python3 analyze.py and read the complete traceback."}
  - {level: 2, text: "A package directory normally contains __init__.py."}
  - {level: 3, text: "Inside a package, .levels means levels.py beside the current file."}
  - {level: 4, text: "Export dbm_to_quality from radio_tools/__init__.py, then import it from radio_tools in analyze.py."}
solution: |
  In `radio_tools/__init__.py`, use `from .levels import dbm_to_quality`.
  In `analyze.py`, use `from radio_tools import dbm_to_quality`. Then run
  `./check`.
explanation: |
  A module is one Python file; a package groups modules in a directory.
  `__init__.py` initializes the package and can define its public API. Absolute
  imports start at the package name, while leading dots are package-relative.
  A virtual environment isolates installed dependencies and interpreters, but
  it does not replace a correct package layout; this standard-library-only
  exercise needs no venv or downloads.
