id: pyq-modern-python
module: python-qualification
title: "Build a Typed Packet Router"
difficulty: hard
estimated_time: "2-4 hours"
prerequisites:
  - python
objectives:
  - model_data_with_dataclasses_and_type_hints
  - dispatch_with_structural_pattern_matching
  - preserve_metadata_in_a_decorator
mastery_evidence: [implement, apply, integrate]
description: |
  Complete a typed packet router using a dataclass, match/case, and a reusable
  decorator that counts successful calls without hiding function metadata.
environment: {type: python, workspace_subdir: pyq-modern-python}
files: [README.txt, packet_router.py, check]
expected_tools: [python3, ./check]
flags: {value: "flag{pyq_modern_python_routes_safely}", validation: session}
hints:
  - {level: 1, text: "Use @dataclass(frozen=True) above Packet."}
  - {level: 2, text: "Type aliases can describe Literal packet kinds and callable decorators."}
  - {level: 3, text: "Put @wraps(func) on the inner wrapper, then store wrapper.calls."}
  - {level: 4, text: "Match Packet(kind='data', payload=payload) and use a guard for empty payloads."}
  - {level: 5, text: "Increment calls only after func returns successfully."}
solution: |
  Make `Packet` a frozen dataclass with typed fields. Implement a generic
  ParamSpec/TypeVar decorator whose `@wraps` wrapper increments `.calls` after
  success. Use class patterns and a guard to return `PING`, `DATA:<hex>`,
  `EMPTY`, or `DROP:<kind>`.
explanation: |
  Type hints document contracts for tools without changing normal runtime
  semantics. Dataclasses remove model boilerplate, match/case makes structured
  dispatch readable, and `functools.wraps` preserves the wrapped function's
  name, documentation, annotations, and introspection chain.
