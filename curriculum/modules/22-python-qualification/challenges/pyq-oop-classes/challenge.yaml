id: pyq-oop-classes
module: python-qualification
title: "Build Signal Meter Classes"
difficulty: easy
estimated_time: "30-60 minutes"
prerequisites:
  - python
objectives:
  - define_and_initialize_classes
  - use_instance_state_and_methods
  - extend_a_class_with_inheritance
  - protect_state_with_a_property
mastery_evidence: [understand, implement]
description: |
  Complete a small SignalMeter hierarchy. The base class stores samples and
  computes an average; a calibrated subclass applies an offset while a property
  prevents invalid calibration values.
environment: {type: python, workspace_subdir: pyq-oop-classes}
files: [README.txt, signal_meter.py, check]
expected_tools: [python3, ./check]
flags: {value: "flag{pyq_classes_measure_signals}", validation: session}
hints:
  - {level: 1, text: "Every instance method receives self first."}
  - {level: 2, text: "Initialize the private list as self._samples = []."}
  - {level: 3, text: "Use super().__init__(name) in the subclass."}
  - {level: 4, text: "The calibrated average is super().average_dbm() plus the offset."}
solution: |
  Initialize `_name` and `_samples`, append float samples, average them, and
  raise `ValueError` when empty. The subclass calls `super().__init__`, validates
  offsets from -20 through 20 in its property setter, and overrides the average
  by adding the offset.
explanation: |
  Classes combine data and behavior. `self` identifies an instance,
  `__init__` establishes valid state, inheritance reuses behavior, and a
  property encapsulates validation behind normal attribute syntax.
