id: pyq-context-exceptions
module: python-qualification
title: "Guard a Receiver Session"
difficulty: medium
estimated_time: "1-2 hours"
prerequisites:
  - python
objectives:
  - implement_a_context_manager
  - define_and_raise_a_custom_exception
  - use_try_except_else_finally
mastery_evidence: [implement, debug, apply]
description: |
  Build a safe receiver-session context manager and parse sample lines while
  handling malformed measurements explicitly.
environment: {type: python, workspace_subdir: pyq-context-exceptions}
files: [README.txt, receiver_session.py, check]
expected_tools: [python3, ./check]
flags: {value: "flag{pyq_context_closes_cleanly}", validation: session}
hints:
  - {level: 1, text: "__enter__ returns the object bound after `as`."}
  - {level: 2, text: "__exit__ runs even when code inside with raises."}
  - {level: 3, text: "Raise SampleFormatError from ValueError to preserve the cause."}
  - {level: 4, text: "Use else for the success append and finally for attempted-count bookkeeping."}
solution: |
  Have `__enter__` mark the session open and return `self`; have `__exit__`
  mark it closed and return `False`. Parse `station,dbm`, translating malformed
  rows into `SampleFormatError`. In `collect`, catch that custom error, append
  successful rows in `else`, and increment attempts in `finally`.
explanation: |
  The `with` protocol guarantees cleanup. Custom exceptions give callers a
  meaningful domain error. `else` runs only when no exception occurred, while
  `finally` runs on every path and is suited to unconditional bookkeeping.
