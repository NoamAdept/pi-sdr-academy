id: orient-system-investigation
module: orientation
title: System Investigation
difficulty: hard
estimated_time: 3-5 hours
prerequisites:
- orient-broken-service
objectives:
- correlate_proc_logs_permissions_networking
- form_and_test_hypotheses
- repair_multi_fault_local_system
- extract_flag_from_restored_pipeline
mastery_evidence:
- understand
- observe
- debug
- apply
- integrate
description: 'EchoRelay is a local TCP service with more than one fault. Fix config,

  permissions, and process state until `./echorelay/verify.sh` prints a flag.


  Read `README.txt` first. Use `relayctl.sh` to start/stop/logs. Compare

  `relay.conf` to the example, fix the dropbox token path/mode, restart, then

  verify. The flag is only in the live PING reply — not in the scripts on disk.


  Paste the printed flag in the dojo, or press Done. No root or Internet.

  '
environment:
  type: mixed
  services:
  - name: echorelay
    start: ./echorelay/relayctl.sh start
  notes: Single challenge folder. Multi-fault investigation; software-only.
files:
- echorelay/
- BRIEFING.md
- README.txt
expected_tools:
- ps
- cat
- chmod
- ls
- ss
- nc
- grep
- tail
- python3
- bash
flags:
  value: flag{multi_signal_systems_triage}
  validation: session
  plant_files:
  - echorelay/data/.relay_secret
hints:
- level: 1
  text: 'Read `BRIEFING.md`, then run `./echorelay/relayctl.sh start` and `./echorelay/verify.sh`.

    '
- level: 2
  text: 'Triage separately: process up? port listening? dropbox readable? config paths
    valid?

    '
- level: 3
  text: 'Check `echorelay/logs/` and compare `config/relay.conf` to `.example`.

    '
- level: 4
  text: 'The dropbox file mode may block the worker; the listen port in config may
    disagree with verify.

    '
- level: 5
  text: 'Worker argv / `/proc/<pid>/environ` may reveal which config it actually loaded.

    '
solution: 'Typical fault set:

  1. `listen_port` mismatch between config and verify expectation (align to 9471)

  2. `dropbox` path wrong or mode `000` — `chmod u+r`

  3. stale PID / worker not running — restart via `relayctl.sh`

  4. Then `./echorelay/verify.sh` prints the flag

  5. `academy submit ''flag{multi_signal_systems_triage}''`

  '
explanation: 'Real systems fail for stacked reasons. Expert operators isolate each

  subsystem (process, config, permissions, network, data) and verify

  independently before recombining. This habit transfers directly to DSP

  receiver debugging: spectrum OK? timing OK? constellation OK? CRC OK?

  '
extension:
  title: Write a postmortem
  description: 'Create `POSTMORTEM.md` listing each root cause, evidence, and fix
    in ≤1 page.

    '
performance_notes: 'Tiny localhost TCP worker.

  '
optional_hardware: []
