id: orient-broken-service
module: orientation
title: Broken Service
difficulty: hard
estimated_time: 2-4 hours
prerequisites:
- orient-environment
objectives:
- diagnose_local_service_failure
- read_logs
- fix_configuration
- verify_service_health
mastery_evidence:
- debug
- apply
- integrate
description: 'Start in the challenge folder and read `README.txt`.


  A small local web service is broken. Try to start it with

  `./service/beaconctl.sh start`, read its logs, and compare the current

  configuration with the example configuration. Fix only the broken values.


  When it stays running, use `curl` on its localhost `/health` URL. The

  response contains the flag. Submit it with quotes:

  ```

  academy submit ''flag{...}''

  ```


  You do not need root or the Internet. Keep the service on localhost.

  '
environment:
  type: service
  services:
  - name: beacon
    start: ./service/beaconctl.sh start
  notes: Single challenge folder. User-space Python service; no systemd required.
files:
- service/
- INCIDENT.txt
- README.txt
expected_tools:
- bash
- python3
- curl
- ss
- netstat
- cat
- grep
- tail
flags:
  value: flag{local_service_restored_on_loopback}
  validation: session
  plant_files:
  - service/data/.beacon_secret
hints:
- level: 1
  text: 'Read INCIDENT.txt and README.txt, then run ./service/beaconctl.sh start and check logs.

    '
- level: 2
  text: 'Compare service/config/beacon.conf with service/config/beacon.conf.example.

    '
- level: 3
  text: 'One setting points at a bad listen address or port; another references a missing data file path.

    '
- level: 4
  text: 'After a clean start, curl the localhost /health URL using the port from the config.

    '
- level: 5
  text: 'The flag appears only in the live /health JSON from the running service.

    '
solution: '1. Fix `listen_host` to `127.0.0.1`

  2. Fix `listen_port` to an unused local port (default `8765`)

  3. Point `data_path` at `service/data/beacon_ok.json`

  4. `./service/beaconctl.sh start`

  5. `curl -s http://127.0.0.1:8765/health`

  6. `academy submit ''flag{local_service_restored_on_loopback}''`

  '
explanation: 'Service debugging is a loop: attempt start → read logs → compare expected

  vs actual config → fix → verify with a local client. Later hard challenges

  compose the same loop across DSP receivers and protocol decoders.

  '
extension:
  title: Failure injection
  description: 'Break one config key on purpose, capture the log line, then restore
    service.

    '
performance_notes: 'Tiny HTTP server on localhost.

  '
optional_hardware: []
