id: orient-permissions
module: orientation
title: Permissions
difficulty: easy
estimated_time: "20-45 minutes"

prerequisites:
  - orient-find-flag

objectives:
  - interpret_ls_permissions
  - understand_owner_group_other
  - use_chmod
  - read_restricted_file

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Start in the challenge folder and read `README.txt`.

  The flag is in `vault/flag.txt`, but its permissions do not let you read
  it yet. Use `ls -l` to inspect the permissions, then use `chmod` to give
  yourself read permission. You own the file, so you do not need `sudo`.

  Read the flag, copy it to the academy flag file, and submit with
  `academy submit`.

environment:
  type: workspace
  notes: Single challenge folder. Permissions only; no privilege escalation required.

files:
  - vault/
  - check_perms.sh
  - README.txt

expected_tools:
  - ls
  - stat
  - chmod
  - cat
  - id
  - namei

flags:
  value: "flag{chmod_u_plus_r_opens_doors}"
  validation: session
  plant_files:
    - vault/flag.txt

hints:
  - level: 1
    text: |
      Run `ls -l vault` and decode the mode string (`-rw----` etc.).
  - level: 2
    text: |
      The first character is type; the next nine bits are user/group/other.
  - level: 3
    text: |
      If you own the file but lack user-read, add it: `chmod u+r vault/flag.txt`.
  - level: 4
    text: |
      After fixing the mode, run `cat vault/flag.txt`, write that value to
      the path in `.flagpath`, and run `academy submit`.

solution: |
  ```bash
  ls -l vault
  stat vault/flag.txt
  chmod u+r vault/flag.txt
  cat vault/flag.txt
  printf '%s\n' 'flag{chmod_u_plus_r_opens_doors}' > "$(cat .flagpath 2>/dev/null || echo $HOME/flag.txt)"
  academy submit
  ```

explanation: |
  Unix discretionary access control uses owner, group, and other with read,
  write, and execute bits. `chmod` changes mode; `chown`/`chgrp` change
  identity. Being able to read `ls -l` fluently is required before systems
  programming and service debugging.

extension:
  title: Least privilege
  description: |
    Set `vault/flag.txt` to mode `0400` after reading it, and verify group/other
    cannot read it via `stat`.

performance_notes: |
  Trivial.

optional_hardware: []
