id: orient-find-flag
module: orientation
title: Find the Flag
difficulty: easy
estimated_time: 15-30 minutes
prerequisites: []
objectives:
- use_pwd_ls_cd
- navigate_filesystem
- use_find_and_cat
- locate_hidden_files
mastery_evidence:
- observe
- apply
description: 'Start in the challenge folder and read `README.txt`.


  A flag is hidden somewhere inside the `labyrinth/` folder. Use simple

  commands such as `ls`, `cd`, `find`, and `cat` to explore the maze and

  read the real flag.


  When you find it, either put it in the academy flag file and submit:

  ```

  printf ''%s\n'' ''flag{...}'' > "$(cat .flagpath 2>/dev/null || echo $HOME/flag.txt)"

  academy submit

  ```

  or submit it directly (keep the quotes in zsh):

  ```

  academy submit ''flag{...}''

  ```

  '
environment:
  type: workspace
  notes: Single challenge folder. Pure filesystem navigation. Offline.
files:
- labyrinth/
- NOTES.txt
- README.txt
expected_tools:
- pwd
- ls
- cd
- find
- cat
- less
- tree
flags:
  value: flag{pwd_ls_find_cat_navigator}
  validation: session
  plant_files:
  - labyrinth/east/tunnel/.cache/secret.flag
hints:
- level: 1
  text: 'Start with `pwd` and `ls -la`. Hidden entries start with a dot.

    '
- level: 2
  text: 'Read `NOTES.txt`. It points toward a directory named like a maze.

    '
- level: 3
  text: '`find . -type f` lists every file under the current directory.

    '
- level: 4
  text: 'Look for a file whose name mentions `flag` or `secret`, then `cat` it.

    '
solution: '```bash

  cat NOTES.txt

  find . -type f

  cat ./labyrinth/east/tunnel/.cache/secret.flag

  printf ''%s\n'' ''flag{pwd_ls_find_cat_navigator}'' > "$(cat .flagpath 2>/dev/null
  || echo $HOME/flag.txt)"

  academy submit

  ```

  '
explanation: 'The shell always has a current working directory (`pwd`). `ls` lists

  directory entries; `ls -la` includes hidden files. `find` recursively

  searches; `cat` prints file contents. These four tools are the foundation

  of every later investigation on this Pi.

  '
extension:
  title: Count the decoys
  description: 'How many files under `labyrinth/` contain the word `decoy`?

    Write the count into `answer.txt` (no flag required).

    '
performance_notes: 'Tiny file tree; negligible I/O.

  '
optional_hardware: []
