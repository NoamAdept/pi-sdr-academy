id: dsp-analyzer
module: dsp-fundamentals
title: Build a Tiny Signal Analyzer
difficulty: hard
estimated_time: 60-90 minutes
prerequisites:
- dsp-reconstruct
objectives:
- numpy
- sampled_signals
- numerical_validation
mastery_evidence:
- understand
- observe
- apply
description: 'RMS measures typical signal level while an FFT peak estimates dominant
  frequency.


  Your task: Analyze signal.npy and write frequency_hz and rms to result.txt.


  Start with `./run`, read `README.md`, edit the starter files, and use

  `./check` whenever you want feedback. Everything runs in this one workspace;

  no hardware, network download, or remote Git repository is needed.

  '
environment:
  type: workspace
  workspace_subdir: dsp-analyzer
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.
files:
- README.md
- analyze.py
- check
- generate_data.py
- run
expected_tools:
- python3
- numpy
- ./run
- ./check
flags:
  value: flag{dsp_analyzer}
  validation: session
hints:
- level: 1
  text: 'Run `./run` first and read its output. Then inspect the starter file and
    README.

    '
- level: 2
  text: 'Work on one observable result at a time; rerun `./check` after each change.

    '
- level: 3
  text: 'Analyze signal.npy and write frequency_hz and rms to result.txt.

    '
- level: 4
  text: 'The solution section names the key command or API if you need a final nudge.

    '
solution: 'RMS is sqrt(mean(x*x)); dominant frequency is the rfftfreq value at the
  largest rFFT magnitude.


  After making the change, run `./run` and then `./check`.

  '
explanation: 'The analyzer reports 180 Hz and RMS near 0.566. The checker validates
  behavior, not a particular editing style, so an

  equivalent correct implementation is accepted.

  '
extension:
  title: Change one parameter
  description: 'After earning the flag, change one input value, predict the result,
    and update

    your implementation so it remains correct rather than hard-coding the answer.

    '
