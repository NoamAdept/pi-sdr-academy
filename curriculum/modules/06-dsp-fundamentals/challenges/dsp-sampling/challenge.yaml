id: dsp-sampling
module: dsp-fundamentals
title: Reason About Sampling
difficulty: easy
estimated_time: 30-45 minutes
prerequisites:
- dsp-measure-freq
objectives:
- numpy
- sampled_signals
- numerical_validation
mastery_evidence:
- understand
- observe
- apply
description: 'Sampling converts a continuous-time idea into evenly spaced measurements.


  Your task: Inspect metadata.txt and calculate sample interval, duration, and sample
  count.


  Start with `./run`, read `README.md`, edit the starter files, and use

  `./check` whenever you want feedback. Everything runs in this one workspace;

  no hardware, network download, or remote Git repository is needed.

  '
environment:
  type: workspace
  workspace_subdir: dsp-sampling
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.
files:
- README.md
- analyze.py
- check
- generate_data.py
- run
expected_tools:
- python3
- numpy
- ./run
- ./check
flags:
  value: flag{dsp_sampling}
  validation: session
hints:
- level: 1
  text: 'Run `./run` first and read its output. Then inspect the starter file and
    README.

    '
- level: 2
  text: 'Work on one observable result at a time; rerun `./check` after each change.

    '
- level: 3
  text: 'Inspect metadata.txt and calculate sample interval, duration, and sample
    count.

    '
- level: 4
  text: 'The solution section names the key command or API if you need a final nudge.

    '
solution: 'Compute `dt=1/sample_rate` and `samples=sample_rate*duration`; write dt,
  duration, and samples.


  After making the change, run `./run` and then `./check`.

  '
explanation: 'result.txt contains dt=0.0005, duration=1.0, and samples=2000. The checker
  validates behavior, not a particular editing style, so an

  equivalent correct implementation is accepted.

  '
extension:
  title: Change one parameter
  description: 'After earning the flag, change one input value, predict the result,
    and update

    your implementation so it remains correct rather than hard-coding the answer.

    '
