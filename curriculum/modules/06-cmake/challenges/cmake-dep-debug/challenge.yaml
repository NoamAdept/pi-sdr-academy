id: cmake-dep-debug
module: cmake
title: Repair a Broken Dependency
difficulty: hard
estimated_time: "50-80 minutes"

prerequisites:
  - cmake-multidir

objectives:
  - cmake_configuration
  - targets
  - repeatable_builds

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Build dependencies include source paths, header search paths, and linked targets.

  Your task: Repair the deliberately broken paths and target link in CMakeLists.txt.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: cmake-dep-debug
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - CMakeLists.txt
  - README.md
  - check
  - main.cpp
  - run
  - src/dsp/signal.cpp
  - src/dsp/signal.hpp

expected_tools:
  - cmake
  - c++
  - ./run
  - ./check

flags:
  value: "flag{cmake_dep_debug}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Repair the deliberately broken paths and target link in CMakeLists.txt.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Use source `src/dsp/signal.cpp`, include path `src/dsp`, and linked target `signal`.

  After making the change, run `./run` and then `./check`.

explanation: |
  A clean configure and build succeeds and dep_app prints energy=25. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
