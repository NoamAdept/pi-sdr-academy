id: cmake-targets
module: cmake
title: Two Independent Targets
difficulty: easy
estimated_time: "30-45 minutes"

prerequisites:
  - cmake-first

objectives:
  - cmake_configuration
  - targets
  - repeatable_builds

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A CMake target is one output, such as an executable or library.

  Your task: Define executable targets receiver and inspector from their matching source files.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: cmake-targets
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - CMakeLists.txt
  - README.md
  - check
  - inspector.cpp
  - receiver.cpp
  - run

expected_tools:
  - cmake
  - c++
  - ./run
  - ./check

flags:
  value: "flag{cmake_targets}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Define executable targets receiver and inspector from their matching source files.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Add `add_executable(receiver receiver.cpp)` and `add_executable(inspector inspector.cpp)`.

  After making the change, run `./run` and then `./check`.

explanation: |
  Both named targets build and print their expected messages. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
