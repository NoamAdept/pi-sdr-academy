id: cmake-static-lib
module: cmake
title: Link a Static Library
difficulty: medium
estimated_time: "40-60 minutes"

prerequisites:
  - cmake-targets

objectives:
  - cmake_configuration
  - targets
  - repeatable_builds

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A static library is reusable compiled code copied into an executable when linking.

  Your task: Build libtelemetry as a STATIC library, publish its include folder, and link monitor to it.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: cmake-static-lib
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - CMakeLists.txt
  - README.md
  - check
  - include/telemetry.hpp
  - main.cpp
  - run
  - src/telemetry.cpp

expected_tools:
  - cmake
  - c++
  - ./run
  - ./check

flags:
  value: "flag{cmake_static_lib}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Build libtelemetry as a STATIC library, publish its include folder, and link monitor to it.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Use `add_library(telemetry STATIC src/telemetry.cpp)`, publish `include` with `target_include_directories`, add `monitor`, and link it to telemetry.

  After making the change, run `./run` and then `./check`.

explanation: |
  The monitor target links through CMake and reports average=20. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
