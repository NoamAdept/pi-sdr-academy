id: sys-tcp-client
module: systems-programming
title: Write a Local TCP Client
difficulty: medium
estimated_time: "50-80 minutes"

prerequisites:
  - sys-process-controller

objectives:
  - operating_system_apis
  - error_handling
  - resource_lifetimes

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  TCP is a reliable byte stream; connect attaches a socket to an IP address and port.

  Your task: Complete client.py to connect only to the local test server, send PING, and print PONG.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: sys-tcp-client
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - check
  - check_fixture.py
  - client.py
  - run

expected_tools:
  - cc
  - python3
  - ./run
  - ./check

flags:
  value: "flag{sys_tcp_client}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Complete client.py to connect only to the local test server, send PING, and print PONG.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Use `socket.create_connection(("127.0.0.1",port))`, sendall PING plus newline, recv, decode, and print.

  After making the change, run `./run` and then `./check`.

explanation: |
  The client exchanges the exact request and response on localhost. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
