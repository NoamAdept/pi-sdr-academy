id: sys-file-descriptors
module: systems-programming
title: Copy with File Descriptors
difficulty: easy
estimated_time: "35-55 minutes"

prerequisites:
  - module:c

objectives:
  - operating_system_apis
  - error_handling
  - resource_lifetimes

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A file descriptor is a small integer a process uses to refer to an open file.

  Your task: Complete copy.c using open, read, write, and close rather than stdio copying.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: sys-file-descriptors
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - check
  - copy.c
  - run

expected_tools:
  - cc
  - python3
  - ./run
  - ./check

flags:
  value: "flag{sys_file_descriptors}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Complete copy.c using open, read, write, and close rather than stdio copying.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Open input with O_RDONLY and output with O_WRONLY|O_CREAT|O_TRUNC; loop on read/write, check errors, and close both descriptors.

  After making the change, run `./run` and then `./check`.

explanation: |
  The program copies every byte and handles system-call errors. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
