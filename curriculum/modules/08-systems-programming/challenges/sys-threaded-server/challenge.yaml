id: sys-threaded-server
module: systems-programming
title: Serve Two Clients with Threads
difficulty: hard
estimated_time: "70-100 minutes"

prerequisites:
  - sys-tcp-client

objectives:
  - operating_system_apis
  - error_handling
  - resource_lifetimes

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A thread is another execution path sharing the process's memory.

  Your task: Complete server.py so each accepted local client is handled in its own thread and receives uppercase text.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: sys-threaded-server
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - check
  - check_fixture.py
  - run
  - server.py

expected_tools:
  - cc
  - python3
  - ./run
  - ./check

flags:
  value: "flag{sys_threaded_server}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Complete server.py so each accepted local client is handled in its own thread and receives uppercase text.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Bind/listen on localhost; start one handler thread per accepted client. Each handler receives and sends `data.upper()`; join both.

  After making the change, run `./run` and then `./check`.

explanation: |
  Two overlapping localhost clients receive independent correct replies. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
