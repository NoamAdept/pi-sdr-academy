id: sys-process-controller
module: systems-programming
title: Control a Child Process
difficulty: medium
estimated_time: "45-70 minutes"

prerequisites:
  - sys-pipes

objectives:
  - operating_system_apis
  - error_handling
  - resource_lifetimes

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  fork creates a child, exec replaces its program, and waitpid collects its status.

  Your task: Complete controller.c to run `/bin/echo child_ok` in a child and verify exit status zero.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: sys-process-controller
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - check
  - controller.c
  - run

expected_tools:
  - cc
  - python3
  - ./run
  - ./check

flags:
  value: "flag{sys_process_controller}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Complete controller.c to run `/bin/echo child_ok` in a child and verify exit status zero.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  The child calls `execl("/bin/echo","echo","child_ok",(char*)0)`; the parent waitpid's it and prints WEXITSTATUS.

  After making the change, run `./run` and then `./check`.

explanation: |
  The controller executes, waits, and reports child_status=0. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
