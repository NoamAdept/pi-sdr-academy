id: grq-complete-topblock
module: gnuradio-cpp
title: "Complete the Qualification Top Block"
difficulty: hard
estimated_time: "80-120 minutes"
prerequisites: []
objectives:
  - complete_top_block
  - block_lifecycle
  - reference_metric_validation
mastery_evidence:
  - implement
  - integrate
  - debug
description: |
  ## Mission
  Rebuild an incomplete top-block script using Source → Throttle →
  FrequencyXlatingFIR → ComplexToMag → MetricsSink. The checker compares
  your graph topology and spectrum metrics with an independent reference.

  Work entirely offline with the bundled Python/NumPy simulator. GNU Radio is
  optional; `OPTIONAL_GNURADIO.md` maps the exercise to real block APIs.
  Run `./run`, edit the starter file, then run `./check`. A correct solution
  writes the flag to `.flagpath`, `ACADEMY_FLAG_PATH`, or `/home/flag.txt`.
environment:
  type: flowgraph
  workspace_subdir: grq-complete-topblock
  notes: Fully offline; GNU Radio and SDR hardware are not required.
files:
  - README.txt
  - OPTIONAL_GNURADIO.md
  - dsp_flow.py
  - complete_topblock.py
  - starter.py
  - run
  - check
  - checker.py
expected_tools:
  - ./run
  - ./check
  - python3
  - numpy
flags:
  value: "flag{complete_topblock_matches_reference_metrics}"
  validation: session
hints:
  - level: 1
    text: "Create every block once so each handle has one persistent identity."
  - level: 2
    text: "Connect the five blocks in the stated order."
  - level: 3
    text: "Use lowpass_taps(500, 8000, 129), center=2200, and then tb.run()."
solution: |
  Instantiate the source, throttle, translating FIR, magnitude block, and metrics sink; connect all handles in one linear chain and run the top block.
explanation: |
  A complete top block owns stable block handles and connection metadata before starting the scheduler. Reference metrics test behavior rather than requiring GNU Radio itself.
extension:
  title: "Try the real runtime"
  description: "If GNU Radio is installed, recreate the graph using the block mapping in OPTIONAL_GNURADIO.md."
performance_notes: "Deterministic arrays are small; checks normally finish in under five seconds on a Raspberry Pi."
optional_hardware: []
