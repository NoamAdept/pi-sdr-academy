id: grq-flowgraph-connect
module: gnuradio-cpp
title: "Wire a Multi-Port Flowgraph"
difficulty: easy
estimated_time: "30-45 minutes"
prerequisites: []
objectives:
  - connect_block_ports
  - run_flowgraph
  - inspect_sink_output
mastery_evidence:
  - understand
  - apply
description: |
  ## Mission
  Wire two sources to distinct ports of an add block, then route the sum
  through a gain block to a sink. Run the graph and recover the sink text.
  Endpoint tuples make the otherwise implicit port zero visible.

  Work entirely offline with the bundled Python/NumPy simulator. GNU Radio is
  optional; `OPTIONAL_GNURADIO.md` maps the exercise to real block APIs.
  Run `./run`, edit the starter file, then run `./check`. A correct solution
  writes the flag to `.flagpath`, `ACADEMY_FLAG_PATH`, or `/home/flag.txt`.
environment:
  type: flowgraph
  workspace_subdir: grq-flowgraph-connect
  notes: Fully offline; GNU Radio and SDR hardware are not required.
files:
  - README.txt
  - OPTIONAL_GNURADIO.md
  - lib_flow.py
  - connect_flowgraph.py
  - starter.py
  - run
  - check
  - checker.py
expected_tools:
  - ./run
  - ./check
  - python3
  - numpy
flags:
  value: "flag{ports_route_samples_to_the_sink}"
  validation: session
hints:
  - level: 1
    text: "Use Endpoint(add, 0) and Endpoint(add, 1) for the two inputs."
  - level: 2
    text: "Connect add → gain → sink after both source edges."
  - level: 3
    text: "Convert the sink bytes to text with bytes(...).decode()."
solution: |
  Connect source A to add port 0 and source B to port 1, then connect add through MultiplyConst(0.5) to the sink and run.
explanation: |
  A flowgraph edge joins an output port to an input port. Port numbers matter whenever a block has multiple inputs or outputs; the scheduler only moves items after every required input is connected.
extension:
  title: "Try the real runtime"
  description: "If GNU Radio is installed, recreate the graph using the block mapping in OPTIONAL_GNURADIO.md."
performance_notes: "Deterministic arrays are small; checks normally finish in under five seconds on a Raspberry Pi."
optional_hardware: []
