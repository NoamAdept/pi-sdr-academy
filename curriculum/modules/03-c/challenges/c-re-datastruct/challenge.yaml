id: c-re-datastruct
module: c
title: "Complete a Linked-List Interface"
difficulty: medium
estimated_time: "55-80 minutes"

prerequisites:
  - c-debug-crash

objectives:
  - linked-lists
  - dynamic-memory
  - reverse-engineering-interfaces

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  The header and tests describe a tiny singly linked list. Complete
  `list.c`: push a value at the front, find the first matching node, report the
  length, and free every node. Study the interface to infer how links and ownership
  work. Allocation failure must leave the list unchanged.

environment:
  type: workspace
  workspace_subdir: c-re-datastruct
  notes: Software-only; no external hardware or network required.

files:
  - README.txt
  - list.h
  - list.c
  - check
  - check.py

expected_tools:
  - bash
  - gcc

flags:
  value: "flag{interfaces_reveal_data_structures}"
  validation: session

hints:
  - level: 1
    text: |
      `list_push_front` allocates one node whose `next` is the old head, then updates `*head`.
  - level: 2
    text: |
      Traverse by repeatedly assigning `node = node->next` until null.
  - level: 3
    text: |
      When freeing, save `next` before calling `free(node)`.

solution: |
  Allocate and initialize a node before replacing the head. Implement
  find and length as straightforward traversals. In destroy, walk the chain while
  preserving the next pointer, free each node, and finally set `*head` to null.

explanation: |
  A linked list stores its order in pointers rather than adjacent
  array positions. Its header reveals the data shape and function contracts.
  Explicit ownership means the module that allocates nodes must also provide a
  complete destruction path.

extension:
  title: "Go further"
  description: |
    Add one more test case of your own and confirm the program still behaves
    correctly.

performance_notes: |
  Sources and test data are intentionally small and compile quickly on a Raspberry Pi.

optional_hardware: []
