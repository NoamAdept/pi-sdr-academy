id: fft-windowing
module: fft
title: Reduce Leakage with a Window
difficulty: medium
estimated_time: "50-75 minutes"

prerequisites:
  - fft-leakage

objectives:
  - numpy_fft
  - frequency_bins
  - spectral_measurement

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A window tapers capture edges to reduce distant spectral leakage.

  Your task: Compare rectangular and Hann-window power outside five bins around the peak.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: fft-windowing
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - analyze.py
  - check
  - generate_data.py
  - run

expected_tools:
  - python3
  - numpy
  - ./run
  - ./check

flags:
  value: "flag{fft_windowing}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Compare rectangular and Hann-window power outside five bins around the peak.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  For each power spectrum exclude five bins on each side of its peak and sum the remainder.

  After making the change, run `./run` and then `./check`.

explanation: |
  result.txt shows Hann far-leakage is lower than rectangular. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
