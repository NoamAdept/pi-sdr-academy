id: qual-py-decorators
module: python-qualification
title: Decorator Call Counter
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-dataclass
objectives:
- decorators
mastery_evidence:
- understand
- apply
description: |
  Write a counted decorator that wraps a function, exposes .calls starting at 0, and increments on every call while returning the original result. Decorators are the clean way to add timing or counters around DSP helpers.
environment:
  type: workspace
  workspace_subdir: qual-py-decorators
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- timing.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_decorators}
  validation: session
hints:
- level: 1
  text: |
    Define an inner wrapper that calls fn(*args, **kwargs).
- level: 2
  text: |
    Keep a calls counter on the wrapper, starting at 0.
- level: 3
  text: |
    Increment calls before or after invoking fn; return fn's result.
solution: |
  decorator increments calls
explanation: |
  Decorators wrap cross-cutting behavior (counts, timing) without editing every call site.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
