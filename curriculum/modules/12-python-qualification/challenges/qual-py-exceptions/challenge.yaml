id: qual-py-exceptions
module: python-qualification
title: Safe Flag Parse
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-context
objectives:
- exceptions
mastery_evidence:
- understand
- apply
description: |
  Flags in this academy look like flag{...}. Complete parse_flag to strip whitespace, accept a valid flag, and raise ValueError for anything else. Exceptions beat silent None returns when operator input is wrong.
environment:
  type: workspace
  workspace_subdir: qual-py-exceptions
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- flags.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_exceptions}
  validation: session
hints:
- level: 1
  text: |
    Strip whitespace first.
- level: 2
  text: |
    Valid text starts with flag{ and ends with }.
- level: 3
  text: |
    raise ValueError when the shape is wrong.
solution: |
  validate or raise
explanation: |
  Raising ValueError makes bad input obvious at the call site instead of passing a bogus flag downstream.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
