id: qual-py-types
module: python-qualification
title: Dynamic Types on the Bench
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-modules
objectives:
- dynamic-typing
mastery_evidence:
- understand
- apply
description: |
  Bench notes arrive as mixed ints, floats, and digit strings. Complete coerce_samples so every value becomes a float in a new list, preserving order. Dynamic typing means you coerce at DSP edges instead of declaring types up front.
environment:
  type: workspace
  workspace_subdir: qual-py-types
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- samples.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_types}
  validation: session
hints:
- level: 1
  text: |
    Call float(x) on each value.
- level: 2
  text: |
    A list comprehension keeps order and builds a new list.
- level: 3
  text: |
    return [float(v) for v in values]
solution: |
  [float(v) for v in values]
explanation: |
  Python is dynamically typed. Coercing at the boundary of a signal path keeps later DSP steps from mixing str and float by accident.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
