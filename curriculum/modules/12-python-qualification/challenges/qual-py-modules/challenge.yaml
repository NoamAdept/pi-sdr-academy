id: qual-py-modules
module: python-qualification
title: Modules for the Radio Rack
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-overview
objectives:
- modules
- imports
mastery_evidence:
- understand
- apply
description: |
  The radio rack needs a shared math helper. Complete wavelength_m(mhz) in radio_math.py so it returns free-space wavelength in meters using c=299792458 and frequency in Hz (mhz * 1e6). Keep the math import — modules package reusable lab code.
environment:
  type: workspace
  workspace_subdir: qual-py-modules
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- radio_math.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_modules}
  validation: session
hints:
- level: 1
  text: |
    Free-space wavelength is c / f with c = 299792458 m/s.
- level: 2
  text: |
    Convert MHz to Hz with mhz * 1e6 before dividing.
- level: 3
  text: |
    return 299792458 / (mhz * 1e6)
solution: |
  return 299792458/(mhz*1e6)
explanation: |
  Modules and imports keep radio math in one place so every script can reuse the same wavelength helper without copy-paste.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
