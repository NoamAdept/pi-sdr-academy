id: qual-py-context
module: python-qualification
title: Context-Managed Capture
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-collections
objectives:
- context-managers
mastery_evidence:
- understand
- apply
description: |
  Capture files must always close. Implement read_capture with a with-open context manager and return the file text stripped of surrounding whitespace. Context managers are Python's RAII for files and other resources.
environment:
  type: workspace
  workspace_subdir: qual-py-context
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- capture.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_context}
  validation: session
hints:
- level: 1
  text: |
    Use `with open(path) as f:` so the file always closes.
- level: 2
  text: |
    Read the whole file, then strip().
- level: 3
  text: |
    The word `with` must appear in capture.py for the check to pass.
solution: |
  with open as f: return f.read().strip()
explanation: |
  with-open guarantees cleanup even when an error interrupts the read — the same idea as RAII in C++.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
