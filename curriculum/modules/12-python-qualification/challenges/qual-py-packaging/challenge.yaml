id: qual-py-packaging
module: python-qualification
title: Tiny Package Layout
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-exceptions
objectives:
- packages
mastery_evidence:
- understand
- apply
description: |
  A tiny labkit package already sits beside your loader. Complete load_version so it imports labkit and returns its version string. Packages and __init__.py turn a folder into an importable toolkit for the Pi lab.
environment:
  type: workspace
  workspace_subdir: qual-py-packaging
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- labkit_loader.py
- run
- check
- check.py
- labkit/__init__.py
expected_tools:
- python3
flags:
  value: flag{qual_py_packaging}
  validation: session
hints:
- level: 1
  text: |
    import labkit (the folder is already present).
- level: 2
  text: |
    Read labkit.version after importing.
- level: 3
  text: |
    return labkit.version
solution: |
  return labkit.version
explanation: |
  Package layouts let you share helpers across challenges and scripts without dumping everything in one file.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
