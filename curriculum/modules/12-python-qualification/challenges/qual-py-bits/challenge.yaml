id: qual-py-bits
module: python-qualification
title: Pack a Beacon Header
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-packaging
objectives:
- struct
- endianness
mastery_evidence:
- understand
- apply
description: |
  Beacon headers on the wire are bytes. Complete pack_header so it packs two unsigned 16-bit integers as big-endian using struct — seq then code — into exactly four bytes. Endianness matters for SDR and network formats.
environment:
  type: workspace
  workspace_subdir: qual-py-bits
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- beacon.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_bits}
  validation: session
hints:
- level: 1
  text: |
    Use struct.pack with a format string.
- level: 2
  text: |
    Big-endian unsigned shorts use >HH.
- level: 3
  text: |
    struct.pack('>HH', seq, code)
solution: |
  struct.pack('>HH',seq,code)
explanation: |
  struct packs Python ints into exact on-wire byte layouts for beacons and protocols.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
