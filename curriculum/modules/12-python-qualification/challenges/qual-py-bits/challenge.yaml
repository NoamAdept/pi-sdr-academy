id: qual-py-bits
module: python-qualification
title: Pack a Beacon Header
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-packaging
objectives:
- struct
- endianness
mastery_evidence:
- understand
- apply
description: |
  pack_header packs two big-endian uint16 values.
environment:
  type: workspace
  workspace_subdir: qual-py-bits
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- beacon.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_bits}
  validation: session
hints:
- level: 1
  text: |
    >HH
- level: 2
  text: |
    struct.pack
- level: 3
  text: |
    BE
solution: |
  struct.pack('>HH',seq,code)
explanation: |
  Wire formats are bytes.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
