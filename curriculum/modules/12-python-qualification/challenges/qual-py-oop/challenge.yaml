id: qual-py-oop
module: python-qualification
title: Classy Signal Meter
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-types
objectives:
- oop
- classes
mastery_evidence:
- understand
- apply
description: |
  Model a small bench instrument: SignalMeter stores power readings in dB. Implement add to record a reading and average to return the mean, or 0.0 when empty. Classes turn instruments into objects you can reuse across lab scripts.
environment:
  type: workspace
  workspace_subdir: qual-py-oop
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- meter.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_oop}
  validation: session
hints:
- level: 1
  text: |
    append each power_db into the internal list.
- level: 2
  text: |
    average is sum(readings) / len(readings).
- level: 3
  text: |
    If the list is empty, return 0.0 instead of dividing.
solution: |
  mean of list
explanation: |
  Object-oriented design models lab gear as objects with state (readings) and behavior (add, average).
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
