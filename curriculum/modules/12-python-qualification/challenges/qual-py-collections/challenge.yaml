id: qual-py-collections
module: python-qualification
title: Peak Picker Comprehension
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-modern
objectives:
- comprehensions
mastery_evidence:
- understand
- apply
description: |
  From a list of amplitude samples, return the indices where the sample is strictly above a threshold. Comprehensions with enumerate are the Pythonic way to filter a stream without a verbose for-loop.
environment:
  type: workspace
  workspace_subdir: qual-py-collections
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- peaks.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_collections}
  validation: session
hints:
- level: 1
  text: |
    enumerate(samples) gives index and value together.
- level: 2
  text: |
    Keep indices where sample > thresh.
- level: 3
  text: |
    [i for i, s in enumerate(samples) if s > thresh]
solution: |
  [i for i,s in enumerate(samples) if s>thresh]
explanation: |
  Comprehensions filter and transform collections in one expression — ideal for peak picking on short captures.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
