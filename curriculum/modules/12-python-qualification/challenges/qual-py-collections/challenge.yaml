id: qual-py-collections
module: python-qualification
title: Peak Picker Comprehension
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-modern
objectives:
- comprehensions
mastery_evidence:
- understand
- apply
description: |
  peaks_above returns indices where sample > thresh.
environment:
  type: workspace
  workspace_subdir: qual-py-collections
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- peaks.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_collections}
  validation: session
hints:
- level: 1
  text: |
    enumerate
- level: 2
  text: |
    comprehension
- level: 3
  text: |
    indices
solution: |
  [i for i,s in enumerate(samples) if s>thresh]
explanation: |
  Comprehensions filter streams.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
