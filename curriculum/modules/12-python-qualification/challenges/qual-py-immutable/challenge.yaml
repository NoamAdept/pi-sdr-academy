id: qual-py-immutable
module: python-qualification
title: Frozen IQ Pairs
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-oop
objectives:
- immutability
mastery_evidence:
- understand
- apply
description: |
  IQ sample pairs should not be mutated after capture. Complete iq_pair so it returns an immutable (i, q) tuple — not a list. In Python, immutability is a property of the object type, similar in spirit to C++ const data.
environment:
  type: workspace
  workspace_subdir: qual-py-immutable
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- iq.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_immutable}
  validation: session
hints:
- level: 1
  text: |
    Return a tuple, not a list.
- level: 2
  text: |
    Pack both components: (i, q).
- level: 3
  text: |
    return (i, q)
solution: |
  return (i,q)
explanation: |
  Tuples protect captured samples from accidental in-place edits that lists allow.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
