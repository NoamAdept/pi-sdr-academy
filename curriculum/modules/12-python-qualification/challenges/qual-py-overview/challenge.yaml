    answer.txt must contain exactly one line with the track id.
- level: 3
  text: |
    The exact spelling is python-qualification (hyphenated).
solution: |
  Write python-qualification into answer.txt
explanation: |
  Qualification overviews orient you before coding. Naming the track id locks progress to the right side path in the dojo.
extension:
  title: Skim next
  description: |
    Browse the next challenge in this module.
