id: qual-py-overview
module: python-qualification
title: Python Qualification Map
difficulty: easy
estimated_time: 10-15 minutes
prerequisites: []
objectives:
- orientation
mastery_evidence:
- understand
description: |
  Open OVERVIEW.txt — the map of this Python qualification path — and write the exact track id `python-qualification` into answer.txt on one line. This mirrors the syllabus overview notebook before hands-on modules begin.
environment:
