id: qual-py-dataclass
module: python-qualification
title: Dataclass Frame Log
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-bits
objectives:
- dataclasses
- json
mastery_evidence:
- understand
- apply
description: |
  Frame already uses @dataclass with freq_mhz and note. Complete to_json so it serializes a Frame through asdict and json.dumps. Dataclasses plus JSON are how lab logs move between scripts without hand-written dicts.
environment:
  type: workspace
  workspace_subdir: qual-py-dataclass
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- frame.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_dataclass}
  validation: session
hints:
- level: 1
  text: |
    asdict(frame) builds a plain dict from the dataclass.
- level: 2
  text: |
    json.dumps turns that dict into a string.
- level: 3
  text: |
    return json.dumps(asdict(frame))
solution: |
  json.dumps(asdict(frame))
explanation: |
  Dataclasses hold structured lab records; asdict + json makes them portable.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
