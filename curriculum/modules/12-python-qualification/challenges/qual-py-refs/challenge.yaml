id: qual-py-refs
module: python-qualification
title: Alias in the Sample Buffer
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-immutable
objectives:
- references
mastery_evidence:
- understand
- apply
description: |
  Python names reference objects. Complete share_buffer so it returns the same list object (an alias), and mutate_last so it changes the last element in place. Understanding aliases prevents surprise mutations in shared sample buffers.
environment:
  type: workspace
  workspace_subdir: qual-py-refs
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- buffer.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_refs}
  validation: session
hints:
- level: 1
  text: |
    share_buffer should return buf itself, not a copy.
- level: 2
  text: |
    mutate_last assigns buf[-1] = value.
- level: 3
  text: |
    Do not slice or list() — that would copy.
solution: |
  alias + assign
explanation: |
  Multiple names can point at one list. In-place edits show up everywhere that alias is used — useful for buffers, dangerous if unexpected.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
