id: qual-py-modern
module: python-qualification
title: Modern Lab Annotations
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-refs
objectives:
- f-strings
mastery_evidence:
- understand
- apply
description: |
  Operator logs need clear tune lines. Complete format_tune so it returns exactly `tune LABEL @ MHz` with the frequency to three decimal places (for example tune NFM @ 146.520 MHz). Modern f-strings keep lab logs readable.
environment:
  type: workspace
  workspace_subdir: qual-py-modern
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- tune.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_modern}
  validation: session
hints:
- level: 1
  text: |
    Use an f-string for the whole line.
- level: 2
  text: |
    Format MHz with :.3f
- level: 3
  text: |
    Exact text: f'tune {label} @ {mhz:.3f} MHz'
solution: |
  f'tune {label} @ {mhz:.3f} MHz'
explanation: |
  F-strings and precise formatting make radio logs easy to scan during a session.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
