id: qual-py-typing
module: python-qualification
title: Typed Gain Stage
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-py-decorators
objectives:
- type-hints
mastery_evidence:
- understand
- apply
description: |
  Complete apply_gain so each sample is multiplied by gain into a new list. Type hints on the signature document the contract for static checkers even though Python still runs dynamically.
environment:
  type: workspace
  workspace_subdir: qual-py-typing
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- gain.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_py_typing}
  validation: session
hints:
- level: 1
  text: |
    Build a new list; do not mutate the input in place.
- level: 2
  text: |
    Multiply each sample by gain.
- level: 3
  text: |
    return [s * gain for s in samples]
solution: |
  [s*gain for s in samples]
explanation: |
  Type hints document DSP contracts for teammates and tools like mypy without changing runtime behavior.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
