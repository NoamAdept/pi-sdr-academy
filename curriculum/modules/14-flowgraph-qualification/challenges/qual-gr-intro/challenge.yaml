id: qual-gr-intro
module: flowgraph-qualification
title: Block Catalog Card
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-gr-overview
objectives:
- flowgraph-basics
mastery_evidence:
- understand
- apply
description: |
  GNU Radio apps are graphs of named blocks. Complete block_name so it returns the string null_source — a classic source tile with outputs and no inputs. We practice the catalog idea in plain Python so no GNU Radio install is required.
environment:
  type: workspace
  workspace_subdir: qual-gr-intro
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- blocks.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_gr_intro}
  validation: session
hints:
- level: 1
  text: |
    Return a string, not a class instance.
- level: 2
  text: |
    Exact spelling: null_source
- level: 3
  text: |
    return 'null_source'
solution: |
  return 'null_source'
explanation: |
  Sources, sinks, and blocks are the vocabulary of a software radio rack.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
