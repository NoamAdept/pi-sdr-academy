    Exact spelling: flowgraph-qualification
solution: |
  Write flowgraph-qualification into answer.txt
explanation: |
  Overview unlocks the offline flowgraph path that mirrors the GNU Radio syllabus.
extension:
  title: Skim next
  description: |
    Browse the next challenge in this module.
