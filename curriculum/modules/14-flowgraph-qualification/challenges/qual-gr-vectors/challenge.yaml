id: qual-gr-vectors
module: flowgraph-qualification
title: Vector Block Gain
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-gr-flowgraph
objectives:
- vector-blocks
- dsp
mastery_evidence:
- understand
- apply
description: |
  Vector blocks process buffers, not scalars. Complete apply_vector_gain so every sample in the list is multiplied by gain into a new list of equal length — the same shape as a GNU Radio work() on float vectors.
environment:
  type: workspace
  workspace_subdir: qual-gr-vectors
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- vector_block.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_gr_vectors}
  validation: session
hints:
- level: 1
  text: |
    Multiply each sample by gain.
- level: 2
  text: |
    Return a new list; keep length identical.
- level: 3
  text: |
    [s * gain for s in samples]
solution: |
  [s*gain for s in samples]
explanation: |
  Vector work() calls operate on arrays of samples per call for throughput.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
