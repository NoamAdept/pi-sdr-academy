id: qual-gr-flowgraph
module: flowgraph-qualification
title: Connect the Flowgraph
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-gr-intro
objectives:
- connections
mastery_evidence:
- understand
- apply
description: |
  A flowgraph is a directed set of connections. Implement connect(src, dst) to record an edge and edges() to return the list of (src, dst) tuples in order. This is the same connect idea as top_block->connect in GNU Radio C++.
environment:
  type: workspace
  workspace_subdir: qual-gr-flowgraph
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- graph.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_gr_flowgraph}
  validation: session
hints:
- level: 1
  text: |
    Store each connection as a (src, dst) tuple.
- level: 2
  text: |
    append to an internal list in connect.
- level: 3
  text: |
    edges() returns that list (order preserved).
solution: |
  store edges list
explanation: |
  Connecting blocks builds the graph; running it later pushes samples along edges.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
