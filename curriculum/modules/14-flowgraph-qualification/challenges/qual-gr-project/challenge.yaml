id: qual-gr-project
module: flowgraph-qualification
title: Tone Processor Chain
difficulty: easy
estimated_time: 20-40 minutes
prerequisites:
- qual-gr-vectors
objectives:
- signal-chain
mastery_evidence:
- understand
- apply
description: |
  Chain two stages like a tiny GNU Radio project: multiply each sample by 2, then take abs, returning the new list. Real flowgraphs wire gain then magnitude blocks the same way — we keep it offline and testable with ./check.
environment:
  type: workspace
  workspace_subdir: qual-gr-project
  notes: Offline qualification challenge (Pi SDR Academy theme). No Jupyter required.
files:
- README.txt
- tone_chain.py
- run
- check
- check.py
expected_tools:
- python3
flags:
  value: flag{qual_gr_project}
  validation: session
hints:
- level: 1
  text: |
    First multiply by 2, then abs.
- level: 2
  text: |
    A single list comprehension can do both.
- level: 3
  text: |
    [abs(s * 2) for s in samples]
solution: |
  [abs(s*2) for s in samples]
explanation: |
  Projects chain blocks end-to-end; this challenge is that chain in one function.
extension:
  title: Go further
  description: |
    Change one input; keep ./check green without hard-coding.
