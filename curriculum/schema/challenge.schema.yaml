# Challenge YAML schema for Pi SDR Academy
# Machine-readable challenge definition (JSON Schema–compatible structure documented here)

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://local.academy/schemas/challenge.schema.yaml
title: AcademyChallenge
type: object
required:
  - id
  - module
  - title
  - difficulty
  - estimated_time
  - prerequisites
  - objectives
  - description
  - environment
  - files
  - expected_tools
  - flags
  - hints
  - solution
  - explanation

properties:
  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)+$"
    description: Stable unique challenge ID (e.g. orient-find-flag)

  module:
    type: string
    description: Module slug (e.g. orientation, bpsk, qpsk)

  title:
    type: string

  difficulty:
    type: string
    enum: [easy, medium, hard]

  estimated_time:
    type: string
    description: Human-readable range, e.g. "15-45 minutes" or "2-4 hours"

  prerequisites:
    type: array
    items:
      type: string
    description: Challenge IDs or topic tags required before this challenge

  objectives:
    type: array
    items:
      type: string
    description: Learning objective tags / short statements

  mastery_evidence:
    type: array
    items:
      type: string
      enum: [understand, observe, implement, debug, apply, integrate]
    description: Which mastery dimensions this challenge exercises

  description: |
    Markdown description shown to the student.

  environment:
    type: object
    properties:
      type:
        type: string
        enum: [workspace, service, iq, flowgraph, mixed]
      workspace_subdir:
        type: string
      services:
        type: array
        items:
          type: object
      notes:
        type: string
    required: [type]

  files:
    type: array
    items:
      type: string
    description: Relative paths under the challenge files/ directory staged into the workspace

  expected_tools:
    type: array
    items:
      type: string

  flags:
    type: object
    required: [value, validation]
    properties:
      value:
        type: string
        description: Canonical flag (stored server-side; not shown to students)
      validation:
        type: string
        enum: [exact, regex, case_insensitive, script]
      pattern:
        type: string
      script:
        type: string
        description: Relative path to offline validator script when validation=script

  hints:
    type: array
    minItems: 2
    items:
      type: object
      required: [level, text]
      properties:
        level:
          type: integer
          minimum: 1
        text:
          type: string

  solution:
    type: string
    description: Instructor/solution walkthrough (hidden from students until unlocked or via staff mode)

  explanation:
    type: string
    description: Concept explanation after solve

  extension:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      optional_flag:
        type: string

  performance_notes:
    type: string
    description: Raspberry Pi sizing / runtime guidance

  optional_hardware:
    type: array
    items:
      type: string
    description: Never required for baseline; e.g. rtl-sdr
