name: tests

on:
  push:
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./platform pytest
      - name: Test
        env:
          ACADEMY_CURRICULUM: ${{ github.workspace }}/curriculum
          PYTHONPATH: ${{ github.workspace }}/platform
        run: python -m pytest platform/tests -q
