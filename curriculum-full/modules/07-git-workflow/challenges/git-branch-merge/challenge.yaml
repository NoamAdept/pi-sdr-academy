id: git-branch-merge
module: git-workflow
title: Merge a Local Feature Branch
difficulty: medium
estimated_time: "45-70 minutes"

prerequisites:
  - git-recover-deleted

objectives:
  - local_git_history
  - inspect_changes
  - safe_recovery

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A branch is a movable name for a commit; a merge joins two lines of work.

  Your task: Merge feature/filter into main, preserve both changes, and commit the resolution.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: git-branch-merge
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - check
  - run

expected_tools:
  - git
  - bash
  - ./run
  - ./check

flags:
  value: "flag{git_branch_merge}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Merge feature/filter into main, preserve both changes, and commit the resolution.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Run `git -C lab merge feature/filter`; preserve gain, sample_rate, and filter and finish the merge commit.

  After making the change, run `./run` and then `./check`.

explanation: |
  main contains both settings and has a real merge commit. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
