id: git-first-repo
module: git-workflow
title: Make Your First Local Commit
difficulty: easy
estimated_time: "25-40 minutes"

prerequisites:
  - module:linux-cli

objectives:
  - local_git_history
  - inspect_changes
  - safe_recovery

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A commit is a saved snapshot in a local Git repository.

  Your task: Initialize lab/, set repository-local identity, add radio.txt, and commit it.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: git-first-repo
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - check
  - run

expected_tools:
  - git
  - bash
  - ./run
  - ./check

flags:
  value: "flag{git_first_repo}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Initialize lab/, set repository-local identity, add radio.txt, and commit it.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  In lab set local user.name and user.email, then run `git add radio.txt` and `git commit -m 'add radio configuration'`.

  After making the change, run `./run` and then `./check`.

explanation: |
  lab has a clean worktree and a commit containing radio.txt. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
