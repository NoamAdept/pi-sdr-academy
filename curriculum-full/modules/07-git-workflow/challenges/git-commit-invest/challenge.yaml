id: git-commit-invest
module: git-workflow
title: Investigate a Commit
difficulty: easy
estimated_time: "30-45 minutes"

prerequisites:
  - git-first-repo

objectives:
  - local_git_history
  - inspect_changes
  - safe_recovery

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  git log shows history and git show reveals exactly what one commit changed.

  Your task: Find the commit that introduced BAD_GAIN=9 and record its full hash in answer.txt.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: git-commit-invest
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - check
  - run

expected_tools:
  - git
  - bash
  - ./run
  - ./check

flags:
  value: "flag{git_commit_invest}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Find the commit that introduced BAD_GAIN=9 and record its full hash in answer.txt.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Run `git -C lab log -p -S BAD_GAIN`; put the full introducing commit hash after `culprit=`.

  After making the change, run `./run` and then `./check`.

explanation: |
  The recorded hash identifies the introducing commit. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
