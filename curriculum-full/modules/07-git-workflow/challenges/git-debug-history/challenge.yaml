id: git-debug-history
module: git-workflow
title: Find a Regression in History
difficulty: medium
estimated_time: "45-70 minutes"

prerequisites:
  - git-branch-merge

objectives:
  - local_git_history
  - inspect_changes
  - safe_recovery

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A regression is a change that made previously correct behavior wrong.

  Your task: Inspect the local history to find where center_hz changed to 91500000; write its hash.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: git-debug-history
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - check
  - run

expected_tools:
  - git
  - bash
  - ./run
  - ./check

flags:
  value: "flag{git_debug_history}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Inspect the local history to find where center_hz changed to 91500000; write its hash.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Run `git -C lab log -p -S center_hz` and record where 100000000 became 91500000.

  After making the change, run `./run` and then `./check`.

explanation: |
  answer.txt names the commit that introduced the bad frequency. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
