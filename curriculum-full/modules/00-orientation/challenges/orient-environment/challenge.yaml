id: orient-environment
module: orientation
title: Environment
difficulty: medium
estimated_time: "1-2 hours"

prerequisites:
  - orient-process-hunt

objectives:
  - inspect_environment_variables
  - use_env_printenv_export
  - recover_hidden_config_from_env
  - understand_process_environ

mastery_evidence:
  - observe
  - apply
  - debug

description: |
  Start in the challenge folder and read `README.txt`.

  Run `./lab_shell.sh` to open a prepared lab shell. The flag has been split
  between two environment variables. Use `env` or `printenv` to find the
  parts, then join them in the correct order.

  Type `exit` when you are done with the lab shell. Put the complete flag in
  the academy flag file, then run `academy submit`.

environment:
  type: workspace
  notes: Single challenge folder. Local environment only.

files:
  - lab_shell.sh
  - decoy.env
  - README_OPS.txt
  - README.txt

expected_tools:
  - env
  - printenv
  - bash
  - grep
  - tr
  - cat

flags:
  value: "flag{env_vars_are_process_state}"
  validation: session
  plant_files:
    - lab_shell.sh

hints:
  - level: 1
    text: |
      Start `./lab_shell.sh`, then run `env | sort`.
  - level: 2
    text: |
      Look for variables prefixed with `ACADEMY_` or `LAB_`.
  - level: 3
    text: |
      Some values are split across multiple variables and must be concatenated.
  - level: 4
    text: |
      Concatenate `LAB_FLAG_PART1` and `LAB_FLAG_PART2` in order.

solution: |
  ```bash
  ./lab_shell.sh
  # inside:
  printenv | grep '^LAB_'
  echo "${LAB_FLAG_PART1}${LAB_FLAG_PART2}"
  exit
  printf '%s\n' 'flag{env_vars_are_process_state}' > "$(cat .flagpath 2>/dev/null || echo $HOME/flag.txt)"
  academy submit
  ```

explanation: |
  Environment variables are per-process key/value state inherited across
  `exec` unless cleared. They commonly hold configuration. `/proc/<pid>/environ`
  exposes them for any readable process. Later modules will hide similar
  configuration in service units and challenge servers.

extension:
  title: Parent environ
  description: |
    From another terminal, find the lab_shell PID and dump its environ via `/proc`.

performance_notes: |
  Negligible.

optional_hardware: []
