id: dsp-sinusoid
module: dsp-fundamentals
title: Generate a Sinusoid
difficulty: easy
estimated_time: "30-45 minutes"

prerequisites:
  - module:python

objectives:
  - numpy
  - sampled_signals
  - numerical_validation

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A sinusoid repeats smoothly; frequency counts cycles per second and amplitude sets height.

  Your task: Complete analyze.py to generate 2048 samples of a 64 Hz, amplitude 0.75 sine at 1024 samples/s.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: dsp-sinusoid
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - analyze.py
  - check
  - generate_data.py
  - run

expected_tools:
  - python3
  - numpy
  - ./run
  - ./check

flags:
  value: "flag{dsp_sinusoid}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Complete analyze.py to generate 2048 samples of a 64 Hz, amplitude 0.75 sine at 1024 samples/s.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Use `n=np.arange(2048)` and `samples=.75*np.sin(2*np.pi*64*n/1024)`, then np.save it.

  After making the change, run `./run` and then `./check`.

explanation: |
  samples.npy has the requested shape and numerical waveform. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
