id: fft-spectrum-analyzer
module: fft
title: Complete a Spectrum Analyzer
difficulty: hard
estimated_time: "65-95 minutes"

prerequisites:
  - fft-multitone

objectives:
  - numpy_fft
  - frequency_bins
  - spectral_measurement

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A spectrum analyzer combines windowing, FFT scaling, peak selection, and a noise estimate.

  Your task: Apply a Hann window and report two tone frequencies plus median noise floor in dB.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: fft-spectrum-analyzer
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - analyze.py
  - check
  - generate_data.py
  - run

expected_tools:
  - python3
  - numpy
  - ./run
  - ./check

flags:
  value: "flag{fft_spectrum_analyzer}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Apply a Hann window and report two tone frequencies plus median noise floor in dB.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Hann-window the input, compute rFFT dB, select two separated peaks, and use median non-peak dB for noise_db.

  After making the change, run `./run` and then `./check`.

explanation: |
  result.txt finds 140 and 410 Hz and a finite noise_db below -20. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
