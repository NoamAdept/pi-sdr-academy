id: cmake-multidir
module: cmake
title: Build Across Directories
difficulty: medium
estimated_time: "45-70 minutes"

prerequisites:
  - cmake-ctest

objectives:
  - cmake_configuration
  - targets
  - repeatable_builds

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  add_subdirectory lets each source folder own part of a larger build.

  Your task: Connect the top-level project to lib/ and app/ CMakeLists files.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: cmake-multidir
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - CMakeLists.txt
  - README.md
  - app/CMakeLists.txt
  - app/main.cpp
  - check
  - lib/CMakeLists.txt
  - lib/scale.cpp
  - lib/scale.hpp
  - run

expected_tools:
  - cmake
  - c++
  - ./run
  - ./check

flags:
  value: "flag{cmake_multidir}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Connect the top-level project to lib/ and app/ CMakeLists files.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Add `add_subdirectory(lib)` followed by `add_subdirectory(app)`.

  After making the change, run `./run` and then `./check`.

explanation: |
  The multidir application builds and prints scaled=42. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
