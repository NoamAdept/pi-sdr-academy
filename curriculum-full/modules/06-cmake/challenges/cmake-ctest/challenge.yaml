id: cmake-ctest
module: cmake
title: Add a CTest
difficulty: medium
estimated_time: "40-60 minutes"

prerequisites:
  - cmake-static-lib

objectives:
  - cmake_configuration
  - targets
  - repeatable_builds

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  CTest is CMake's test runner; add_test registers a command as a test.

  Your task: Enable testing, build calc_tests, and register it with CTest.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: cmake-ctest
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - CMakeLists.txt
  - README.md
  - calc.cpp
  - calc.hpp
  - check
  - run
  - tests.cpp

expected_tools:
  - cmake
  - c++
  - ./run
  - ./check

flags:
  value: "flag{cmake_ctest}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Enable testing, build calc_tests, and register it with CTest.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Add `enable_testing()` and `add_test(NAME addition COMMAND calc_tests)`.

  After making the change, run `./run` and then `./check`.

explanation: |
  ctest discovers the test and reports it passing. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
