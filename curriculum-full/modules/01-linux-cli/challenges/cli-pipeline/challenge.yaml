id: cli-pipeline
module: linux-cli
title: "Build Your First Pipeline"
difficulty: easy
estimated_time: "20-30 minutes"

prerequisites:
  - module:orientation

objectives:
  - pipes
  - grep
  - sort

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  A receiver survey is stored in `readings.csv`. Create `answer.txt`
  containing the callsigns of the three strongest northern stations, strongest
  first. Use a command pipeline: each command should do one small job. Run
  `./check` when the three lines are ready.

environment:
  type: workspace
  workspace_subdir: cli-pipeline
  notes: Software-only; any networking stays on localhost.

files:
  - README.txt
  - readings.csv
  - check
  - check.py

expected_tools:
  - bash
  - grep
  - sort
  - head

flags:
  value: "flag{pipes_make_data_flow}"
  validation: session

hints:
  - level: 1
    text: |
      Use `grep ',north,' readings.csv` to keep northern rows.
  - level: 2
    text: |
      A comma is the field separator. `sort -t, -k3,3nr` sorts field 3 numerically in reverse.
  - level: 3
    text: |
      After sorting, use `head -n 3`, then `cut -d, -f1`.

solution: |
  Run:
  `grep ',north,' readings.csv | sort -t, -k3,3nr | head -n 3 | cut -d, -f1 > answer.txt`
  Then run `./check`.

explanation: |
  A pipe (`|`) sends one command's output into the next command.
  Filtering before sorting keeps the later steps simple. Numeric reverse sorting
  puts the largest signal first, and `cut` selects only the callsign column.

extension:
  title: "Go further"
  description: |
    Change the input data and make your solution handle the new case without
    changing its output format.

performance_notes: |
  Inputs are intentionally tiny and run comfortably on a Raspberry Pi.

optional_hardware: []
