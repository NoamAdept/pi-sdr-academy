id: cli-multistage-pipeline
module: linux-cli
title: "Summarize Locked Signals"
difficulty: medium
estimated_time: "35-55 minutes"

prerequisites:
  - cli-shell-automation

objectives:
  - awk
  - pipelines
  - aggregation

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Turn a CSV signal scan into a compact report. Keep only `LOCKED`
  rows with SNR at least 10. For each band, write the number of qualifying rows
  and their average SNR to one decimal place as `band,count,average`. Sort bands
  alphabetically and save the result as `summary.csv`.

environment:
  type: workspace
  workspace_subdir: cli-multistage-pipeline
  notes: Software-only; any networking stays on localhost.

files:
  - README.txt
  - signals.csv
  - check
  - check.py

expected_tools:
  - bash
  - awk
  - sort

flags:
  value: "flag{stages_turn_rows_into_answers}"
  validation: session

hints:
  - level: 1
    text: |
      Skip the header with `NR > 1` in awk.
  - level: 2
    text: |
      Use arrays indexed by band: `count[$2]++` and `sum[$2]+=$3`.
  - level: 3
    text: |
      Print all array entries in awk's `END` block, then pipe to `sort`.

solution: |
  Use an awk filter and accumulator:
  `awk -F, 'NR>1 && $4=="LOCKED" && $3>=10 {c[$2]++; s[$2]+=$3} END {for (b in c) printf "%s,%d,%.1f\n",b,c[b],s[b]/c[b]}' signals.csv | sort > summary.csv`.

explanation: |
  This pipeline has three stages: parse and filter rows, aggregate
  values by band, then sort the generated groups. `awk` is useful when a task
  needs both column selection and a small amount of arithmetic.

extension:
  title: "Go further"
  description: |
    Change the input data and make your solution handle the new case without
    changing its output format.

performance_notes: |
  Inputs are intentionally tiny and run comfortably on a Raspberry Pi.

optional_hardware: []
