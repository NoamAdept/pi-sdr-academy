id: cppq-namespaces-const
module: cpp-qualification
title: "Qualify Names and Protect State"
difficulty: easy
estimated_time: "35-50 minutes"

prerequisites:
  - cpp-debug-app

objectives:
  - namespaces-and-scope-resolution
  - const-correctness
  - volatile-observation

mastery_evidence:
  - understand
  - implement
  - apply

description: |
  Repair a small receiver-status program. Put symbols in the requested
  namespaces, use `::` to disambiguate them, make read-only APIs const-correct,
  and demonstrate a volatile shared flag without treating volatile as thread
  synchronization. Run `./check` to compile the hidden tests and recover the flag.

environment:
  type: workspace
  workspace_subdir: cppq-namespaces-const
  notes: Software-only; no external hardware or network required.

files:
  - README.md
  - qualification.cpp
  - check

expected_tools:
  - bash
  - g++

flags:
  value: "flag{qualified_names_preserve_intent}"
  validation: session

hints:
  - level: 1
    text: Put both `channel` functions in namespaces and call them with qualified names.
  - level: 2
    text: A getter that does not mutate its object should be marked `const`.
  - level: 3
    text: Read the volatile flag explicitly; volatile provides visibility to the abstract machine, not atomicity.

solution: |
  Define `radio::channel` and `diagnostics::channel`, make
  `Receiver::frequency() const`, and have `shared_ready()` compare the volatile
  flag with zero. Print `145` when both qualified calls and readiness agree.

explanation: |
  Namespaces prevent collisions, scope resolution states which symbol is meant,
  and const-correct APIs communicate mutation guarantees. Volatile is useful for
  some hardware-facing observations but is not a replacement for atomics.

extension:
  title: "Use an atomic flag"
  description: Replace the volatile demonstration with `std::atomic<bool>` and compare the semantics.

performance_notes: The source and hidden tests compile quickly on a Raspberry Pi.
optional_hardware: []
