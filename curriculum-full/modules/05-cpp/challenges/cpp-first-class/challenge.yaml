id: cpp-first-class
module: cpp
title: "Build Your First C++ Class"
difficulty: easy
estimated_time: "35-55 minutes"

prerequisites:
  - module:debugging-gdb

objectives:
  - classes
  - constructors
  - const-methods

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Complete the `Radio` class. Its constructor stores a name and
  starting frequency. `tune` accepts only positive frequencies and reports
  success. Accessors return the current values and must not modify the object.

environment:
  type: workspace
  workspace_subdir: cpp-first-class
  notes: Software-only; no external hardware or network required.

files:
  - README.txt
  - radio.hpp
  - radio.cpp
  - check
  - check.py

expected_tools:
  - bash
  - g++

flags:
  value: "flag{classes_keep_state_and_behavior_together}"
  validation: session

hints:
  - level: 1
    text: |
      Initialize members in the constructor's initializer list.
  - level: 2
    text: |
      A read-only method ends with `const` in both declaration and definition.
  - level: 3
    text: |
      In `tune`, return false before changing state when the input is not positive.

solution: |
  Initialize `name_` and `frequency_`. Implement const accessors that
  return each member. In `tune`, reject `hz <= 0`; otherwise assign and return
  true.

explanation: |
  A class keeps related state private and exposes controlled
  operations. Constructors establish a valid initial state, and const methods
  promise not to change it.

extension:
  title: "Go further"
  description: |
    Add one more test case of your own and confirm the program still behaves
    correctly.

performance_notes: |
  Sources and test data are intentionally small and compile quickly on a Raspberry Pi.

optional_hardware: []
