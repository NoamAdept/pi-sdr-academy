id: cpp-smart-ptr
module: cpp
title: "Build an Ownership Tree"
difficulty: medium
estimated_time: "45-70 minutes"

prerequisites:
  - cpp-raii

objectives:
  - unique-ptr
  - weak-ptr
  - shared-ptr

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Complete a tree node that owns children with `std::unique_ptr`.
  `add_child` constructs a node, stores it, and returns a non-owning raw pointer
  valid while the tree lives. `find` recursively returns the first matching node.
  No manual `new` or `delete` is needed.

environment:
  type: workspace
  workspace_subdir: cpp-smart-ptr
  notes: Software-only; no external hardware or network required.

files:
  - README.txt
  - node.hpp
  - node.cpp
  - check
  - check.py

expected_tools:
  - bash
  - g++

flags:
  value: "flag{smart_pointers_express_ownership}"
  validation: session

hints:
  - level: 1
    text: |
      Create a child with `std::make_unique<Node>(name)`.
  - level: 2
    text: |
      Save `child.get()` before moving the unique pointer into `children_`.
  - level: 3
    text: |
      In `find`, check this node first, then recursively ask every child.

solution: |
  Make a unique child, save its raw pointer, move it into the vector,
  and return the saved pointer. Search by comparing `name_`, then looping over
  children and returning the first non-null recursive result.

explanation: |
  A `unique_ptr` states that exactly one owner controls an object's
  lifetime. Nesting unique pointers models a tree naturally: destroying the root
  recursively destroys every descendant.

extension:
  title: "Go further"
  description: |
    Add one more test case of your own and confirm the program still behaves
    correctly.

performance_notes: |
  Sources and test data are intentionally small and compile quickly on a Raspberry Pi.

optional_hardware: []
