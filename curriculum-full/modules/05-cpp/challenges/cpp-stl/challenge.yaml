id: cpp-stl
module: cpp
title: "Summarize Samples with the STL"
difficulty: easy
estimated_time: "35-55 minutes"

prerequisites:
  - cpp-first-class

objectives:
  - vector
  - algorithms
  - map

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Implement three functions using C++ standard-library containers
  and algorithms: return sorted unique samples, calculate the mean (zero for an
  empty vector), and count occurrences in an ordered map.

environment:
  type: workspace
  workspace_subdir: cpp-stl
  notes: Software-only; no external hardware or network required.

files:
  - README.txt
  - stats.hpp
  - stats.cpp
  - check
  - check.py

expected_tools:
  - bash
  - g++

flags:
  value: "flag{the_stl_reuses_battle_tested_tools}"
  validation: session

hints:
  - level: 1
    text: |
      Sort a vector copy, call `std::unique`, then erase the unused tail.
  - level: 2
    text: |
      `std::accumulate` can sum values; provide `0.0` as the initial value.
  - level: 3
    text: |
      `counts[value]++` inserts a missing map key with zero before incrementing.

solution: |
  Copy and sort the vector, erase from `unique`'s returned iterator to
  end, use `accumulate / size` with an empty check, and loop over samples to
  increment a `std::map<int, std::size_t>`.

explanation: |
  The Standard Template Library provides reusable containers and
  algorithms. Combining them expresses common operations clearly and avoids
  rewriting error-prone sorting and storage code.

extension:
  title: "Go further"
  description: |
    Add one more test case of your own and confirm the program still behaves
    correctly.

performance_notes: |
  Sources and test data are intentionally small and compile quickly on a Raspberry Pi.

optional_hardware: []
