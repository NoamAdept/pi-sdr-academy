id: pyq-collections
module: python-qualification
title: "Summarize Receiver Events"
difficulty: medium
estimated_time: "1-2 hours"
prerequisites:
  - python
objectives:
  - choose_lists_dicts_and_sets
  - write_comprehensions
  - group_values_with_defaultdict
mastery_evidence: [implement, apply]
description: |
  Process a tiny in-memory receiver log into per-station counts, unique
  frequencies, strong-event IDs, and average signal levels.
environment: {type: workspace, workspace_subdir: pyq-collections}
files: [README.txt, events.py, check]
expected_tools: [python3, ./check]
flags: {value: "flag{pyq_collections_shape_data}", validation: session}
hints:
  - {level: 1, text: "A set automatically removes duplicate frequencies."}
  - {level: 2, text: "Use a list comprehension with an if clause for strong IDs."}
  - {level: 3, text: "defaultdict(list) lets you append without first creating each key."}
  - {level: 4, text: "Build sums or grouped lists first, then compute each station average."}
solution: |
  Iterate once to count stations and append dBm values to a
  `defaultdict(list)`. Use a set comprehension for frequencies and a filtered
  list comprehension for event IDs. Derive averages from the grouped lists.
explanation: |
  Lists preserve order, dictionaries map keys to values, and sets model unique
  membership. Comprehensions express small transformations, while
  `defaultdict` removes repetitive missing-key setup during grouping.
