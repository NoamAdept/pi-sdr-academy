id: arch-endianness
module: computer-architecture
title: Observe Byte Order
difficulty: easy
estimated_time: "30-45 minutes"

prerequisites:
  - arch-registers

objectives:
  - machine_representation
  - compiler_output
  - runtime_observation

mastery_evidence:
  - understand
  - observe
  - apply

description: |
  Endianness is the order used to store the bytes of a multi-byte integer.

  Your task: Run probe.c and record this machine's first byte and byte order in answer.txt.

  Start with `./run`, read `README.md`, edit the starter files, and use
  `./check` whenever you want feedback. Everything runs in this one workspace;
  no hardware, network download, or remote Git repository is needed.

environment:
  type: workspace
  workspace_subdir: arch-endianness
  notes: Software-only, offline, and suitable for Raspberry Pi and macOS where applicable.

files:
  - README.md
  - answer.txt
  - check
  - probe.c
  - run

expected_tools:
  - cc
  - assembly_or_disassembler
  - ./run
  - ./check

flags:
  value: "flag{arch_endianness}"
  validation: session

hints:
  - level: 1
    text: |
      Run `./run` first and read its output. Then inspect the starter file and README.
  - level: 2
    text: |
      Work on one observable result at a time; rerun `./check` after each change.
  - level: 3
    text: |
      Run probe.c and record this machine's first byte and byte order in answer.txt.
  - level: 4
    text: |
      The solution section names the key command or API if you need a final nudge.

solution: |
  Run the probe and copy its first_byte and order. Typical Pi and Mac hosts are `04` and `little`, but use your measurement.

  After making the change, run `./run` and then `./check`.

explanation: |
  The answer matches the runtime observation on ARM64, x86-64, or another host. The checker validates behavior, not a particular editing style, so an
  equivalent correct implementation is accepted.

extension:
  title: "Change one parameter"
  description: |
    After earning the flag, change one input value, predict the result, and update
    your implementation so it remains correct rather than hard-coding the answer.
