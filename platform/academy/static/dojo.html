<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pi SDR Academy</title>
  <style>
    :root {
      --bg: #1a1512;
      --panel: #221c18;
      --fg: #e8e4df;
      --muted: #8a8278;
      --lime: #e08a4f;
      --cyan: #c4a484;
      --ink: #1a1512;
      --line: #3a322c;
      --danger: #e06a5c;
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--fg);
      background: var(--bg);
      font-family: var(--font);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(900px 480px at 12% -8%, rgba(224,138,79,0.08), transparent 55%),
        #1a1512;
    }
    .top {
      position: sticky; top: 0; z-index: 30;
      background: rgba(26,21,18,0.94);
      border-bottom: 1px solid var(--line);
    }
    .top-inner {
      max-width: 760px; margin: 0 auto;
      padding: 0.7rem 1rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; font-style: normal; }
    .dots .r { background: #e06a5c; }
    .dots .y { background: #e08a4f; }
    .dots .g { background: #6a9e6a; }
    .brand {
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none; color: inherit; font-weight: 800;
    }
    .brand i {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center;
      background: var(--lime); color: var(--ink);
      font-style: normal; font-weight: 900; font-family: var(--mono); font-size: 0.75rem;
    }
    .brand b { color: var(--lime); }
    .score {
      margin-left: auto;
      font-family: var(--mono); font-size: 0.8rem; color: var(--muted);
    }
    .score strong { color: var(--lime); }
    .wrap {
      position: relative; z-index: 1;
      max-width: 760px; margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
    }
    .hero {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.1rem; flex-wrap: wrap;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      letter-spacing: -0.03em; line-height: 1;
    }
    .hero h1 em { font-style: normal; color: var(--lime); }
    .hero p {
      margin: 0.4rem 0 0;
      color: var(--muted); font-size: 0.92rem; font-family: var(--mono);
    }
    .sticker {
      width: min(160px, 36vw); height: auto; flex-shrink: 0;
      border-radius: 22px;
      background: #f4f0ea;
      border: 3px solid #111;
      box-shadow: 4px 4px 0 #111;
      object-fit: cover;
    }
    .loop {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem;
      margin: 0 0 1.1rem;
    }
    @media (max-width: 560px) { .loop { grid-template-columns: 1fr; } }
    .loop div {
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--panel); padding: 0.65rem 0.75rem;
    }
    .loop i {
      display: block; font-style: normal;
      font-family: var(--mono); font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--lime);
      margin-bottom: 0.2rem;
    }
    .loop span { color: var(--muted); font-size: 0.82rem; line-height: 1.35; }

    .now {
      border: 3px solid #111;
      border-radius: 16px;
      background: #f4efe6;
      color: #1a1512;
      padding: 1rem 1.05rem 1.1rem;
      box-shadow: 4px 4px 0 #111;
      margin-bottom: 1.25rem;
    }
    .now .lbl {
      font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: #5a5048; margin-bottom: 0.35rem;
    }
    .now h2 { margin: 0; font-size: 1.35rem; line-height: 1.15; }
    .now .belt {
      margin-top: 0.25rem;
      font-family: var(--mono); font-size: 0.75rem; color: #c45a1a;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .now .mission {
      margin: 0.7rem 0 0;
      font-size: 0.95rem; line-height: 1.45; color: #2a241f;
    }
    .now .ws {
      margin-top: 0.65rem;
      font-family: var(--mono); font-size: 0.78rem;
      background: #1a1512; color: #e08a4f;
      border-radius: 8px; padding: 0.55rem 0.65rem;
      word-break: break-all;
    }
    .now .acts {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      margin-top: 0.85rem; align-items: center;
    }
    .go {
      border: 0; border-radius: 8px;
      background: var(--lime); color: var(--ink);
      font-family: var(--mono); font-weight: 800;
      padding: 0.75rem 1.15rem;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .go:hover { filter: brightness(1.06); }
    .go:disabled { opacity: 0.45; cursor: not-allowed; }
    .ghost {
      border: 2px solid #111; border-radius: 8px;
      background: transparent; color: #1a1512;
      font-family: var(--mono); font-weight: 700;
      padding: 0.65rem 0.9rem;
    }
    .now .fb {
      margin-top: 0.55rem;
      font-family: var(--mono); font-size: 0.78rem; color: #5a5048; min-height: 1em;
    }
    .now .fb.ok { color: #2f6b3a; }
    .now .fb.bad { color: #a33; }
    .now .done-msg {
      margin: 0; font-size: 1.05rem; font-weight: 700;
    }
    .flagrow {
      display: grid; grid-template-columns: 1fr auto; gap: 0.4rem;
      margin-top: 0.65rem; width: 100%;
    }
    .flagrow input {
      border: 2px solid #111; border-radius: 8px;
      padding: 0.55rem 0.65rem; font-family: var(--mono); font-size: 0.85rem;
      background: #fff; color: #1a1512;
    }
    .hints .h {
      margin-top: 0.35rem; padding: 0.35rem 0.5rem;
      border-left: 3px solid #c45a1a; background: rgba(0,0,0,0.05);
      font-size: 0.85rem; color: #3a322c;
    }

    .xp {
      margin: 0 0 1rem;
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--panel); padding: 0.75rem 0.85rem;
    }
    .xp-top {
      display: flex; justify-content: space-between; gap: 0.5rem;
      font-family: var(--mono); font-size: 0.72rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 0.45rem;
    }
    .xp-top em { font-style: normal; color: var(--lime); }
    .xp-track {
      height: 14px; border: 2px solid #111; border-radius: 999px;
      background: #2a241f; overflow: hidden;
    }
    .xp-fill {
      height: 100%; width: 0%;
      background: repeating-linear-gradient(-45deg, #e08a4f 0 8px, #f0a86a 8px 16px);
      transition: width .35s cubic-bezier(.2,.8,.2,1);
    }
    .belts {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem;
      margin-top: 0.7rem;
    }
    .belt {
      text-align: center;
      font-family: var(--mono); font-size: 0.62rem;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .belt img {
      width: 42px; height: 34px; object-fit: contain;
      filter: grayscale(0.35); opacity: 0.7;
    }
    .belt.on img, .belt.done img { filter: none; opacity: 1; }
    .belt.on img { animation: bob .9s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .sec {
      margin: 1.2rem 0 0.55rem;
      font-family: var(--mono); font-size: 0.72rem;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan);
    }
    .path {
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .card {
      width: 100%; text-align: left; color: inherit;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--panel); padding: 0.85rem 0.95rem;
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.75rem; align-items: center;
    }
    .card:hover { border-color: var(--lime); }
    .card.locked { opacity: 0.45; }
    .card img.b {
      width: 64px; height: 48px; object-fit: contain;
      background: #f4f0ea; border: 2px solid #111; border-radius: 8px; padding: 2px;
    }
    .card h3 { margin: 0; font-size: 1rem; }
    .card .meta {
      margin-top: 0.2rem;
      font-family: var(--mono); font-size: 0.72rem; color: var(--muted);
    }
    .card .chip {
      font-family: var(--mono); font-size: 0.65rem; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.2rem 0.45rem; border-radius: 6px;
      background: var(--lime); color: var(--ink);
    }
    .card .chip.lock { background: #3a3a3a; color: #bbb; }
    .card .chip.done { background: var(--cyan); color: #1a1512; }

    .back {
      border: 1px solid var(--line); background: transparent; color: var(--lime);
      border-radius: 8px; padding: 0.4rem 0.7rem; margin-bottom: 1rem;
      font-family: var(--mono); font-size: 0.78rem;
    }
    .dhero {
      display: flex; gap: 0.85rem; align-items: center;
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--panel); padding: 0.9rem 1rem; margin-bottom: 0.9rem;
    }
    .dhero img {
      width: 88px; height: 66px; object-fit: contain;
      background: #f4f0ea; border: 2px solid #111; border-radius: 10px; padding: 3px;
    }
    .dhero h1 { margin: 0; font-size: 1.35rem; }
    .dhero p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.88rem; }
    .clist { display: flex; flex-direction: column; gap: 0.4rem; }
    .crow {
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden;
    }
    .crow.open { border-color: color-mix(in srgb, var(--lime) 40%, var(--line)); }
    .crow > button.row {
      width: 100%; border: 0; background: transparent; color: inherit;
      display: flex; justify-content: space-between; gap: 0.75rem; align-items: center;
      padding: 0.8rem 0.95rem; text-align: left; cursor: pointer;
    }
    .crow h3 { margin: 0; font-size: 0.98rem; }
    .crow.solved h3 { color: var(--lime); }
    .crow .r {
      font-family: var(--mono); font-size: 0.68rem; color: var(--muted);
      text-transform: uppercase; white-space: nowrap;
    }
    .crow .r.ok { color: var(--lime); }
    .cbody {
      display: none; padding: 0 0.95rem 0.95rem;
      border-top: 1px solid var(--line);
    }
    .crow.open .cbody { display: block; padding-top: 0.75rem; }
    .cbody .m { margin: 0; font-size: 0.9rem; line-height: 1.4; color: var(--muted); }
    .cbody .acts { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; }
    .btn {
      border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,0.3);
      color: var(--fg); padding: 0.55rem 0.8rem; font-weight: 700; font-size: 0.85rem;
    }
    .btn.pri { background: var(--lime); color: var(--ink); border-color: transparent; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .cbody .ws {
      margin-top: 0.5rem; font-family: var(--mono); font-size: 0.72rem;
      color: var(--cyan); word-break: break-all;
    }
    .cbody .fb { margin-top: 0.4rem; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
    .cbody .fb.ok { color: var(--cyan); }
    .cbody .fb.bad { color: var(--danger); }
    .cbody .flagrow { margin-top: 0.55rem; }
    .cbody .flagrow input {
      border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
      color: var(--fg); padding: 0.55rem 0.65rem; font-family: var(--mono); font-size: 0.85rem;
    }
    .toasts {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 50;
      display: flex; flex-direction: column; gap: 0.4rem;
      max-width: min(320px, calc(100vw - 2rem));
    }
    .toast {
      border-radius: 10px; padding: 0.65rem 0.8rem;
      background: rgba(26,21,18,0.96); border: 1px solid var(--line);
      animation: in .2s ease;
    }
    .toast.ok { border-color: color-mix(in srgb, var(--cyan) 50%, var(--line)); }
    .toast.bad { border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
    .toast b { display: block; }
    .toast span { color: var(--muted); font-size: 0.8rem; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="top-inner">
      <span class="dots" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></span>
      <a class="brand" href="#" id="home-link"><i>PT</i> Pi SDR <b>Academy</b></a>
      <div class="score"><strong id="progress">…</strong></div>
    </div>
  </header>

  <main class="wrap">
    <div id="view-home">
      <div class="hero">
        <div>
          <h1>Pi SDR <em>Academy</em></h1>
          <p>One loop. Fifty challenges. No cloud.</p>
        </div>
        <img class="sticker" src="/icons/ponytail.png" alt="" width="160" height="160"/>
      </div>

      <div class="loop" aria-label="How to play">
        <div><i>1 · Start</i><span>Files drop into the challenge folder.</span></div>
        <div><i>2 · Solve</i><span>Open that folder. Read README.txt.</span></div>
        <div><i>3 · Done</i><span>Press Done here when you think you finished.</span></div>
      </div>

      <section class="now" id="now" aria-live="polite"></section>

      <div class="xp">
        <div class="xp-top"><span>Progress</span><span><em id="xp-count">0</em> / <span id="xp-total">50</span></span></div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
        <div class="belts" id="belts"></div>
      </div>

      <div class="sec">Belts</div>
      <div class="path" id="belts-list"></div>
    </div>

    <div id="view-dojo" class="hidden">
      <button type="button" class="back" id="btn-back">← Belts</button>
      <div class="dhero" id="dhero"></div>
      <div class="clist" id="clist"></div>
    </div>
  </main>

  <div class="toasts" id="toasts"></div>

  <script>
    const BELT = { white:'belt-white', yellow:'belt-yellow', orange:'belt-orange', green:'belt-green', blue:'belt-blue' };
    const home = document.getElementById('view-home');
    const detail = document.getElementById('view-dojo');
    let catalog = null;
    let nextCh = null;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function toast(t, d, kind='ok') {
      const el = document.createElement('div');
      el.className = 'toast ' + kind;
      el.innerHTML = `<b>${esc(t)}</b><span>${esc(d||'')}</span>`;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
    async function api(path, opts) {
      const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || r.statusText || 'request failed');
      return data;
    }

    async function startChallenge(id, fb) {
      fb.className = 'fb'; fb.textContent = 'Starting…';
      const data = await api('/api/challenges/' + encodeURIComponent(id) + '/start', { method: 'POST', body: '{}' });
      const ws = data.workspace || '';
      fb.className = 'fb ok';
      fb.textContent = 'Started. Open that folder and read README.txt.';
      toast('Started', id, 'ok');
      return ws;
    }

    async function doneChallenge(id, flag, fb) {
      fb.className = 'fb';
      fb.textContent = flag ? 'Submitting…' : 'Checking…';
      let data;
      if (flag) {
        data = await api('/api/challenges/' + encodeURIComponent(id) + '/submit', {
          method: 'POST', body: JSON.stringify({ flag })
        });
      } else {
        data = await api('/api/challenges/' + encodeURIComponent(id) + '/check', {
          method: 'POST', body: '{}'
        });
      }
      if (data.ok) {
        fb.className = 'fb ok';
        fb.textContent = data.explanation || 'Cleared. Next challenge unlocked.';
        toast('Cleared', id, 'ok');
        return true;
      }
      fb.className = 'fb bad';
      fb.textContent = data.error || 'Not yet — keep working in the folder.';
      if (data.detail) fb.textContent += ' ' + data.detail.slice(0, 200);
      return false;
    }

    async function hintChallenge(id, box) {
      const data = await api('/api/challenges/' + encodeURIComponent(id) + '/hint', {
        method: 'POST', body: '{}'
      });
      const row = document.createElement('div');
      row.className = 'h';
      row.textContent = data.text || 'No more hints.';
      box.appendChild(row);
    }

    function paintNow() {
      const box = document.getElementById('now');
      if (!nextCh) {
        box.innerHTML = `<div class="lbl">Path complete</div><p class="done-msg">All fifty challenges cleared. Nice work.</p>`;
        return;
      }
      const ch = nextCh;
      box.innerHTML = `
        <div class="lbl">Do this next</div>
        <h2>${esc(ch.title)}</h2>
        <div class="belt">${esc(ch.belt_label)} · ${esc(ch.dojo_title)}</div>
        <p class="mission">${esc(ch.mission || '')}</p>
        <div class="ws ${ch.workspace ? '' : 'hidden'}" id="now-ws">${ch.workspace ? 'Folder: ' + esc(ch.workspace) : ''}</div>
        <div class="acts">
          <button type="button" class="go" id="now-start">${ch.started ? 'Re-start' : '1 · Start'}</button>
          <button type="button" class="go" id="now-done" ${ch.started ? '' : 'disabled'}>3 · Done</button>
          <button type="button" class="ghost" id="now-hint">Hint</button>
        </div>
        <div class="flagrow">
          <input id="now-flag" placeholder="or paste flag{…} if you found one"/>
          <button type="button" class="ghost" id="now-flag-go">Go</button>
        </div>
        <div class="hints" id="now-hints"></div>
        <div class="fb" id="now-fb"></div>
      `;
      const fb = () => document.getElementById('now-fb');
      document.getElementById('now-start').onclick = async () => {
        try {
          const ws = await startChallenge(ch.id, fb());
          const el = document.getElementById('now-ws');
          el.textContent = 'Folder: ' + ws;
          el.classList.remove('hidden');
          document.getElementById('now-done').disabled = false;
          ch.started = true;
          ch.workspace = ws;
        } catch (e) { fb().className = 'fb bad'; fb().textContent = e.message; }
      };
      document.getElementById('now-done').onclick = async () => {
        try {
          const ok = await doneChallenge(ch.id, '', fb());
          if (ok) await load();
        } catch (e) { fb().className = 'fb bad'; fb().textContent = e.message; }
      };
      document.getElementById('now-flag-go').onclick = async () => {
        const flag = (document.getElementById('now-flag').value || '').trim();
        if (!flag) { fb().className = 'fb bad'; fb().textContent = 'Paste a flag, or press Done to auto-check.'; return; }
        try {
          const ok = await doneChallenge(ch.id, flag, fb());
          if (ok) await load();
        } catch (e) { fb().className = 'fb bad'; fb().textContent = e.message; }
      };
      document.getElementById('now-hint').onclick = async () => {
        try { await hintChallenge(ch.id, document.getElementById('now-hints')); }
        catch (e) { fb().className = 'fb bad'; fb().textContent = e.message; }
      };
      document.getElementById('now-flag').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('now-flag-go').click();
      });
    }

    function paintBelts(dojos, solved, total) {
      const pct = total ? Math.round(100 * solved / total) : 0;
      document.getElementById('xp-fill').style.width = pct + '%';
      document.getElementById('xp-count').textContent = solved;
      document.getElementById('xp-total').textContent = total;
      document.getElementById('progress').textContent = solved + '/' + total;

      const cores = (dojos || []).filter(d => d.kind === 'core');
      const belts = document.getElementById('belts');
      belts.innerHTML = '';
      cores.forEach(d => {
        const done = d.challenges > 0 && d.solved >= d.challenges;
        const on = nextCh && d.id === nextCh.dojo_id;
        const el = document.createElement('div');
        el.className = 'belt' + (done ? ' done' : '') + (on ? ' on' : '');
        el.innerHTML = `
          <img src="/icons/${BELT[d.belt] || 'belt-white'}.png" alt=""/>
          <div>${esc((d.belt_label || '').replace(/ Belt$/i, ''))}</div>
        `;
        belts.appendChild(el);
      });

      const list = document.getElementById('belts-list');
      list.innerHTML = '';
      cores.forEach(d => {
        const done = d.challenges > 0 && d.solved >= d.challenges;
        const on = nextCh && d.id === nextCh.dojo_id;
        let chip = '';
        if (d.locked) chip = '<span class="chip lock">Locked</span>';
        else if (done) chip = '<span class="chip done">Done</span>';
        else if (on) chip = '<span class="chip">Now</span>';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card' + (d.locked ? ' locked' : '');
        btn.innerHTML = `
          <img class="b" src="/icons/${BELT[d.belt] || 'belt-white'}.png" alt=""/>
          <div>
            <h3>${esc(d.title)}</h3>
            <div class="meta">${d.solved}/${d.challenges} · ${esc(d.tagline || d.belt_label || '')}</div>
          </div>
          ${chip}
        `;
        btn.onclick = () => { if (!d.locked) openDojo(d.id); };
        list.appendChild(btn);
      });
    }

    function challengeRow(ch, locked, autoOpen) {
      const wrap = document.createElement('div');
      wrap.className = 'crow' + (ch.solved ? ' solved' : '') + (autoOpen ? ' open' : '');
      wrap.dataset.id = ch.id;
      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'row';
      head.innerHTML = `
        <h3>${esc(ch.title)}</h3>
        <span class="r ${ch.solved ? 'ok' : ''}">${ch.solved ? 'cleared' : (locked ? 'locked' : 'open')}</span>
      `;
      const body = document.createElement('div');
      body.className = 'cbody';
      body.innerHTML = `
        <p class="m">${esc(ch.mission || ch.description || '')}</p>
        <div class="ws" id="ws-${esc(ch.id)}"></div>
        <div class="acts">
          <button type="button" class="btn pri" data-act="start" ${locked?'disabled':''}>1 · Start</button>
          <button type="button" class="btn pri" data-act="done" ${locked||ch.solved?'disabled':''}>3 · Done</button>
          <button type="button" class="btn" data-act="hint" ${locked?'disabled':''}>Hint</button>
        </div>
        <div class="flagrow">
          <input id="flag-${esc(ch.id)}" placeholder="or paste flag{…}" ${ch.solved||locked?'disabled':''}/>
          <button type="button" class="btn" data-act="flag" ${ch.solved||locked?'disabled':''}>Go</button>
        </div>
        <div class="hints" id="hints-${esc(ch.id)}"></div>
        <div class="fb" id="fb-${esc(ch.id)}"></div>
      `;
      head.onclick = () => wrap.classList.toggle('open');
      body.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn || btn.disabled) return;
        const act = btn.dataset.act;
        const fb = body.querySelector('#fb-' + CSS.escape(ch.id));
        try {
          if (act === 'start') {
            const ws = await startChallenge(ch.id, fb);
            body.querySelector('#ws-' + CSS.escape(ch.id)).textContent = 'Folder: ' + ws;
          } else if (act === 'done') {
            const ok = await doneChallenge(ch.id, '', fb);
            if (ok) {
              wrap.classList.add('solved');
              head.querySelector('.r').className = 'r ok';
              head.querySelector('.r').textContent = 'cleared';
              await load(true);
            }
          } else if (act === 'flag') {
            const flag = (body.querySelector('input').value || '').trim();
            if (!flag) { fb.className = 'fb bad'; fb.textContent = 'Paste a flag, or press Done.'; return; }
            const ok = await doneChallenge(ch.id, flag, fb);
            if (ok) {
              wrap.classList.add('solved');
              await load(true);
            }
          } else if (act === 'hint') {
            await hintChallenge(ch.id, body.querySelector('#hints-' + CSS.escape(ch.id)));
          }
        } catch (err) {
          fb.className = 'fb bad';
          fb.textContent = err.message || String(err);
        }
      });
      wrap.appendChild(head);
      wrap.appendChild(body);
      return wrap;
    }

    async function openDojo(id, keep) {
      const d = await api('/api/dojos/' + encodeURIComponent(id));
      const hero = document.getElementById('dhero');
      hero.innerHTML = `
        <img src="/icons/${BELT[d.belt] || 'belt-white'}.png" alt=""/>
        <div>
          <h1>${esc(d.title)}</h1>
          <p>${esc(d.belt_label || '')} · ${d.solved}/${d.challenges}${d.locked ? ' · locked' : ''}</p>
        </div>
      `;
      const root = document.getElementById('clist');
      root.innerHTML = '';
      const focus = (nextCh && nextCh.dojo_id === id) ? nextCh.id : d.next_challenge_id;
      (d.modules_detail || []).forEach(mod => {
        (mod.challenges || []).forEach(ch => {
          root.appendChild(challengeRow(ch, d.locked, ch.id === focus && !ch.solved));
        });
      });
      home.classList.add('hidden');
      detail.classList.remove('hidden');
      if (!keep) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        history.pushState({ view: 'dojo', id }, '', '#dojo/' + id);
        const open = root.querySelector('.crow.open');
        if (open) open.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function showHome() {
      detail.classList.add('hidden');
      home.classList.remove('hidden');
      history.pushState({ view: 'home' }, '', '#');
    }

    async function load(stay) {
      const [status, cat] = await Promise.all([api('/api/status'), api('/api/dojos')]);
      catalog = cat;
      nextCh = cat.next_challenge || null;
      if (nextCh && status.current_challenge_id === nextCh.id) {
        nextCh.started = true;
        nextCh.workspace = status.current_workspace;
      }
      paintNow();
      paintBelts(cat.dojos || [], status.solved, status.total);
      if (stay && detail.classList.contains('hidden') === false) {
        const m = (location.hash || '').match(/^#dojo\/(.+)$/);
        if (m) await openDojo(decodeURIComponent(m[1]), true);
      } else if (!stay) {
        const m = (location.hash || '').match(/^#dojo\/(.+)$/);
        if (m) await openDojo(decodeURIComponent(m[1]));
      }
    }

    document.getElementById('btn-back').onclick = showHome;
    document.getElementById('home-link').onclick = (e) => { e.preventDefault(); showHome(); };
    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.view === 'dojo' && e.state.id) openDojo(e.state.id);
      else { detail.classList.add('hidden'); home.classList.remove('hidden'); }
    });
    load().catch(err => toast('Load failed', err.message || String(err), 'bad'));
  </script>
</body>
</html>
