<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pi SDR Academy</title>
  <style>
    /* Tetradic accents: teal ↔ coral, indigo ↔ amber. Surfaces stay cool slate. */
    :root {
      --teal: #2A9D8F;
      --coral: #E76F51;
      --indigo: #6C7AE0;
      --amber: #E9C46A;
      --bg: #0E1218;
      --surface: #161C26;
      --raised: #1C2430;
      --line: #2A3444;
      --fg: #E8EDF5;
      --muted: #8B95A8;
      --ink: #0E1218;
      --ok: #2A9D8F;
      --bad: #E76F51;
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --radius: 12px;
      --pad: clamp(1rem, 3vw, 1.5rem);
      --max: 40rem;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--fg);
      background:
        radial-gradient(720px 360px at 8% -10%, rgba(42,157,143,0.12), transparent 55%),
        radial-gradient(640px 320px at 100% 0%, rgba(231,111,81,0.08), transparent 50%),
        var(--bg);
      font-family: var(--font);
      line-height: 1.45;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    .top {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(10px);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid var(--line);
    }
    .top-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0.75rem var(--pad);
      display: flex; align-items: center; gap: 0.75rem;
    }
    .brand {
      display: flex; align-items: center; gap: 0.55rem;
      text-decoration: none; color: inherit; font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand img {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--line); background: #f3eee6; object-fit: cover;
    }
    .brand b { color: var(--teal); font-weight: 700; }
    .score {
      margin-left: auto;
      font-family: var(--mono); font-size: 0.8rem; color: var(--muted);
    }
    .score strong { color: var(--coral); font-weight: 700; }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 1.25rem var(--pad) 3.5rem;
    }

    .hero { margin-bottom: 1.1rem; }
    .hero h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.35rem);
      letter-spacing: -0.03em; line-height: 1.05;
    }
    .hero h1 em { font-style: normal; color: var(--teal); }
    .hero p {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-family: var(--mono); font-size: 0.85rem;
    }

    .loop {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin: 0 0 1.15rem;
    }
    .loop div {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 0.7rem 0.75rem;
    }
    .loop i {
      display: block; font-style: normal;
      font-family: var(--mono); font-size: 0.68rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--teal); margin-bottom: 0.25rem;
    }
    .loop span { color: var(--muted); font-size: 0.82rem; line-height: 1.35; }
    @media (max-width: 560px) {
      .loop { grid-template-columns: 1fr; }
    }

    .now {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--raised);
      padding: 1rem 1.05rem 1.1rem;
      margin-bottom: 1.15rem;
    }
    .now .lbl {
      font-family: var(--mono); font-size: 0.68rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--amber); margin-bottom: 0.35rem;
    }
    .now h2 {
      margin: 0;
      font-size: clamp(1.15rem, 3.5vw, 1.4rem);
      letter-spacing: -0.02em; line-height: 1.2;
    }
    .now .belt {
      margin-top: 0.3rem;
      font-family: var(--mono); font-size: 0.72rem;
      color: var(--coral); letter-spacing: 0.06em; text-transform: uppercase;
    }
    .now .mission {
      margin: 0.7rem 0 0;
      color: var(--muted); font-size: 0.95rem;
    }
    .now .ws {
      margin-top: 0.7rem;
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--teal);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      word-break: break-all;
    }
    .acts {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      margin-top: 0.9rem; align-items: center;
    }
    .go, .ghost, .btn {
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-family: var(--mono); font-weight: 700; font-size: 0.82rem;
      letter-spacing: 0.02em;
      transition: background .15s ease, border-color .15s ease, opacity .15s ease;
    }
    .go, .btn.pri {
      border: 0;
      background: var(--teal); color: var(--ink);
    }
    .go:hover, .btn.pri:hover { filter: brightness(1.06); }
    .go:disabled, .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
    .ghost, .btn {
      border: 1px solid var(--line);
      background: transparent; color: var(--fg);
    }
    .ghost:hover, .btn:hover { border-color: var(--indigo); }
    .fb {
      margin-top: 0.55rem;
      font-family: var(--mono); font-size: 0.78rem;
      color: var(--muted); min-height: 1.1em;
    }
    .fb.ok { color: var(--ok); }
    .fb.bad { color: var(--bad); }
    .done-msg { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .flagrow {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.4rem;
      margin-top: 0.7rem;
      width: 100%;
    }
    .flagrow input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--fg);
      padding: 0.65rem 0.75rem;
      font-family: var(--mono); font-size: 0.85rem;
      outline: none;
    }
    .flagrow input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(42,157,143,0.18);
    }
    .hints .h {
      margin-top: 0.4rem;
      padding: 0.4rem 0.55rem;
      border-left: 3px solid var(--indigo);
      background: rgba(108,122,224,0.08);
      font-size: 0.88rem; color: var(--muted);
    }

    .xp {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 0.8rem 0.9rem;
      margin-bottom: 0.35rem;
    }
    .xp-top {
      display: flex; justify-content: space-between; gap: 0.5rem;
      font-family: var(--mono); font-size: 0.7rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .xp-top em { font-style: normal; color: var(--coral); }
    .xp-track {
      height: 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .xp-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--teal), var(--amber), var(--coral));
      transition: width .35s cubic-bezier(.2,.8,.2,1);
    }
    .belts {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.35rem;
      margin-top: 0.75rem;
    }
    .belt {
      text-align: center;
      font-family: var(--mono); font-size: 0.6rem;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .belt img {
      width: 40px; height: 32px; object-fit: contain;
      opacity: 0.45; filter: grayscale(0.4);
      transition: opacity .2s ease, filter .2s ease;
    }
    .belt.on img, .belt.done img { opacity: 1; filter: none; }
    .belt.on img { animation: bob .9s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    .sec {
      margin: 1.15rem 0 0.55rem;
      font-family: var(--mono); font-size: 0.7rem;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--indigo);
    }
    .path { display: flex; flex-direction: column; gap: 0.45rem; }
    .card {
      width: 100%; text-align: left; color: inherit;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface);
      padding: 0.8rem 0.9rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.7rem; align-items: center;
      transition: border-color .15s ease;
    }
    .card:hover { border-color: var(--teal); }
    .card.locked { opacity: 0.45; }
    .card.locked:hover { border-color: var(--line); }
    .card img.b {
      width: 56px; height: 42px; object-fit: contain;
      background: #f3eee6; border: 1px solid var(--line);
      border-radius: 8px; padding: 2px;
    }
    .card h3 { margin: 0; font-size: 0.98rem; letter-spacing: -0.01em; }
    .card .meta {
      margin-top: 0.2rem;
      font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
    }
    .chip {
      font-family: var(--mono); font-size: 0.62rem; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.22rem 0.45rem; border-radius: 6px;
      background: var(--teal); color: var(--ink); white-space: nowrap;
    }
    .chip.lock { background: #3A4454; color: #B8C0D0; }
    .chip.done { background: var(--indigo); color: #fff; }

    .back {
      border: 1px solid var(--line); background: transparent; color: var(--teal);
      border-radius: 8px; padding: 0.4rem 0.7rem; margin-bottom: 0.9rem;
      font-family: var(--mono); font-size: 0.78rem;
    }
    .dhero {
      display: flex; gap: 0.85rem; align-items: center;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); padding: 0.85rem 0.95rem; margin-bottom: 0.85rem;
    }
    .dhero img {
      width: 72px; height: 54px; object-fit: contain;
      background: #f3eee6; border: 1px solid var(--line);
      border-radius: 8px; padding: 2px; flex-shrink: 0;
    }
    .dhero h1 { margin: 0; font-size: clamp(1.15rem, 3vw, 1.35rem); }
    .dhero p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.88rem; }

    .clist { display: flex; flex-direction: column; gap: 0.4rem; }
    .crow {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); overflow: hidden;
    }
    .crow.open { border-color: color-mix(in srgb, var(--teal) 45%, var(--line)); }
    .crow > button.row {
      width: 100%; border: 0; background: transparent; color: inherit;
      display: flex; justify-content: space-between; gap: 0.75rem; align-items: center;
      padding: 0.8rem 0.9rem; text-align: left; cursor: pointer;
    }
    .crow h3 { margin: 0; font-size: 0.95rem; }
    .crow.solved h3 { color: var(--teal); }
    .crow .r {
      font-family: var(--mono); font-size: 0.68rem; color: var(--muted);
      text-transform: uppercase; white-space: nowrap;
    }
    .crow .r.ok { color: var(--teal); }
    .cbody {
      display: none; padding: 0 0.9rem 0.9rem;
      border-top: 1px solid var(--line);
    }
    .crow.open .cbody { display: block; padding-top: 0.75rem; }
    .cbody .m { margin: 0; font-size: 0.9rem; color: var(--muted); }
    .cbody .ws {
      margin-top: 0.5rem; font-family: var(--mono); font-size: 0.72rem;
      color: var(--teal); word-break: break-all;
    }

    .toasts {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 40;
      display: flex; flex-direction: column; gap: 0.4rem;
      max-width: min(20rem, calc(100vw - 2rem));
    }
    .toast {
      border-radius: 10px; padding: 0.65rem 0.8rem;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      animation: in .2s ease;
    }
    .toast.ok { border-color: color-mix(in srgb, var(--teal) 50%, var(--line)); }
    .toast.bad { border-color: color-mix(in srgb, var(--coral) 50%, var(--line)); }
    .toast b { display: block; }
    .toast span { color: var(--muted); font-size: 0.8rem; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 420px) {
      .card { grid-template-columns: auto 1fr; }
      .card .chip { grid-column: 2; justify-self: start; }
      .flagrow { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#" id="home-link">
        <img src="/icons/ponytail.png" alt="" width="36" height="36"/>
        Pi SDR <b>Academy</b>
      </a>
      <div class="score"><strong id="progress">…</strong></div>
    </div>
  </header>

  <main class="wrap">
    <div id="view-home">
      <div class="hero">
        <h1>Pi SDR <em>Academy</em></h1>
        <p>One loop · fifty challenges · offline</p>
      </div>

      <div class="loop" aria-label="How to play">
        <div><i>1 · Start</i><span>Files land in the challenge folder.</span></div>
        <div><i>2 · Solve</i><span>Open that folder. Read README.txt.</span></div>
        <div><i>3 · Done</i><span>Press Done when you finish.</span></div>
      </div>

      <section class="now" id="now" aria-live="polite"></section>

      <div class="xp">
        <div class="xp-top"><span>Progress</span><span><em id="xp-count">0</em> / <span id="xp-total">50</span></span></div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
        <div class="belts" id="belts"></div>
      </div>

      <div class="sec">Belts</div>
      <div class="path" id="belts-list"></div>
    </div>

    <div id="view-dojo" class="hidden">
      <button type="button" class="back" id="btn-back">← Belts</button>
      <div class="dhero" id="dhero"></div>
      <div class="clist" id="clist"></div>
    </div>
  </main>

  <div class="toasts" id="toasts"></div>

  <script>
    const BELT = { white:'belt-white', yellow:'belt-yellow', orange:'belt-orange', green:'belt-green', blue:'belt-blue' };
    const home = document.getElementById('view-home');
    const detail = document.getElementById('view-dojo');
    let nextCh = null;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function toast(t, d, kind='ok') {
      const el = document.createElement('div');
      el.className = 'toast ' + kind;
      el.innerHTML = `<b>${esc(t)}</b><span>${esc(d||'')}</span>`;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
    async function api(path, opts) {
      const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || r.statusText || 'request failed');
      return data;
    }

    async function startChallenge(id, fb) {
      fb.className = 'fb'; fb.textContent = 'Starting…';
      const data = await api('/api/challenges/' + encodeURIComponent(id) + '/start', { method: 'POST', body: '{}' });
      const ws = data.workspace || '';
      fb.className = 'fb ok';
      fb.textContent = 'Started. Open that folder and read README.txt.';
      toast('Started', id, 'ok');
      return ws;
    }

    async function doneChallenge(id, flag, fb) {
      fb.className = 'fb';
      fb.textContent = flag ? 'Submitting…' : 'Checking…';
      const data = flag
        ? await api('/api/challenges/' + encodeURIComponent(id) + '/submit', { method: 'POST', body: JSON.stringify({ flag }) })
        : await api('/api/challenges/' + encodeURIComponent(id) + '/check', { method: 'POST', body: '{}' });
      if (data.ok) {
        fb.className = 'fb ok';
        fb.textContent = data.explanation || 'Cleared.';
        toast('Cleared', id, 'ok');
        return true;
      }
      fb.className = 'fb bad';
      fb.textContent = data.error || 'Not yet — keep working in the folder.';
      if (data.detail) fb.textContent += ' ' + String(data.detail).slice(0, 180);
      return false;
    }

    async function hintChallenge(id, box) {
      const data = await api('/api/challenges/' + encodeURIComponent(id) + '/hint', { method: 'POST', body: '{}' });
      const row = document.createElement('div');
      row.className = 'h';
      row.textContent = data.text || 'No more hints.';
      box.appendChild(row);
    }

    function paintNow() {
      const box = document.getElementById('now');
      if (!nextCh) {
        box.innerHTML = `<div class="lbl">Complete</div><p class="done-msg">All fifty challenges cleared.</p>`;
        return;
      }
      const ch = nextCh;
      box.innerHTML = `
        <div class="lbl">Do this next</div>
        <h2>${esc(ch.title)}</h2>
        <div class="belt">${esc(ch.belt_label)} · ${esc(ch.dojo_title)}</div>
        <p class="mission">${esc(ch.mission || '')}</p>
        <div class="ws ${ch.workspace ? '' : 'hidden'}" id="now-ws">${ch.workspace ? 'Folder: ' + esc(ch.workspace) : ''}</div>
        <div class="acts">
          <button type="button" class="go" id="now-start">${ch.started ? 'Re-start' : '1 · Start'}</button>
          <button type="button" class="go" id="now-done" ${ch.started ? '' : 'disabled'}>3 · Done</button>
          <button type="button" class="ghost" id="now-hint">Hint</button>
        </div>
        <div class="flagrow">
          <input id="now-flag" placeholder="or paste flag{…}"/>
          <button type="button" class="ghost" id="now-flag-go">Go</button>
        </div>
        <div class="hints" id="now-hints"></div>
        <div class="fb" id="now-fb"></div>
      `;
      const fb = () => document.getElementById('now-fb');
      document.getElementById('now-start').onclick = async () => {
        try {
          const ws = await startChallenge(ch.id, fb());
          const el = document.getElementById('now-ws');
          el.textContent = 'Folder: ' + ws;
          el.classList.remove('hidden');
          document.getElementById('now-done').disabled = false;
          ch.started = true; ch.workspace = ws;
        } catch (e) { fb().className = 'fb bad'; fb().textContent = e.message; }
      };
      document.getElementById('now-done').onclick = async () => {
        try { if (await doneChallenge(ch.id, '', fb())) await load(); }
        catch (e) { fb().className = 'fb bad'; fb().textContent = e.message; }
      };
      document.getElementById('now-flag-go').onclick = async () => {
        const flag = (document.getElementById('now-flag').value || '').trim();
        if (!flag) { fb().className = 'fb bad'; fb().textContent = 'Paste a flag, or press Done.'; return; }
        try { if (await doneChallenge(ch.id, flag, fb())) await load(); }
        catch (e) { fb().className = 'fb bad'; fb().textContent = e.message; }
      };
      document.getElementById('now-hint').onclick = async () => {
        try { await hintChallenge(ch.id, document.getElementById('now-hints')); }
        catch (e) { fb().className = 'fb bad'; fb().textContent = e.message; }
      };
      document.getElementById('now-flag').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('now-flag-go').click();
      });
    }

    function paintBelts(dojos, solved, total) {
      const pct = total ? Math.round(100 * solved / total) : 0;
      document.getElementById('xp-fill').style.width = pct + '%';
      document.getElementById('xp-count').textContent = solved;
      document.getElementById('xp-total').textContent = total;
      document.getElementById('progress').textContent = solved + '/' + total;

      const cores = (dojos || []).filter(d => d.kind === 'core');
      const belts = document.getElementById('belts');
      belts.innerHTML = '';
      cores.forEach(d => {
        const done = d.challenges > 0 && d.solved >= d.challenges;
        const on = nextCh && d.id === nextCh.dojo_id;
        const el = document.createElement('div');
        el.className = 'belt' + (done ? ' done' : '') + (on ? ' on' : '');
        el.innerHTML = `
          <img src="/icons/${BELT[d.belt] || 'belt-white'}.png" alt=""/>
          <div>${esc((d.belt_label || '').replace(/ Belt$/i, ''))}</div>
        `;
        belts.appendChild(el);
      });

      const list = document.getElementById('belts-list');
      list.innerHTML = '';
      cores.forEach(d => {
        const done = d.challenges > 0 && d.solved >= d.challenges;
        const on = nextCh && d.id === nextCh.dojo_id;
        let chip = '';
        if (d.locked) chip = '<span class="chip lock">Locked</span>';
        else if (done) chip = '<span class="chip done">Done</span>';
        else if (on) chip = '<span class="chip">Now</span>';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card' + (d.locked ? ' locked' : '');
        btn.innerHTML = `
          <img class="b" src="/icons/${BELT[d.belt] || 'belt-white'}.png" alt=""/>
          <div>
            <h3>${esc(d.title)}</h3>
            <div class="meta">${d.solved}/${d.challenges} · ${esc(d.tagline || d.belt_label || '')}</div>
          </div>
          ${chip}
        `;
        btn.onclick = () => { if (!d.locked) openDojo(d.id); };
        list.appendChild(btn);
      });
    }

    function challengeRow(ch, locked, autoOpen) {
      const wrap = document.createElement('div');
      wrap.className = 'crow' + (ch.solved ? ' solved' : '') + (autoOpen ? ' open' : '');
      const head = document.createElement('button');
      head.type = 'button';
      head.className = 'row';
      head.innerHTML = `
        <h3>${esc(ch.title)}</h3>
        <span class="r ${ch.solved ? 'ok' : ''}">${ch.solved ? 'cleared' : (locked ? 'locked' : 'open')}</span>
      `;
      const body = document.createElement('div');
      body.className = 'cbody';
      body.innerHTML = `
        <p class="m">${esc(ch.mission || ch.description || '')}</p>
        <div class="ws" id="ws-${esc(ch.id)}"></div>
        <div class="acts">
          <button type="button" class="btn pri" data-act="start" ${locked?'disabled':''}>1 · Start</button>
          <button type="button" class="btn pri" data-act="done" ${locked||ch.solved?'disabled':''}>3 · Done</button>
          <button type="button" class="btn" data-act="hint" ${locked?'disabled':''}>Hint</button>
        </div>
        <div class="flagrow">
          <input id="flag-${esc(ch.id)}" placeholder="or paste flag{…}" ${ch.solved||locked?'disabled':''}/>
          <button type="button" class="btn" data-act="flag" ${ch.solved||locked?'disabled':''}>Go</button>
        </div>
        <div class="hints" id="hints-${esc(ch.id)}"></div>
        <div class="fb" id="fb-${esc(ch.id)}"></div>
      `;
      head.onclick = () => wrap.classList.toggle('open');
      body.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn || btn.disabled) return;
        const act = btn.dataset.act;
        const fb = body.querySelector('#fb-' + CSS.escape(ch.id));
        try {
          if (act === 'start') {
            const ws = await startChallenge(ch.id, fb);
            body.querySelector('#ws-' + CSS.escape(ch.id)).textContent = 'Folder: ' + ws;
          } else if (act === 'done') {
            if (await doneChallenge(ch.id, '', fb)) {
              wrap.classList.add('solved');
              head.querySelector('.r').className = 'r ok';
              head.querySelector('.r').textContent = 'cleared';
              await load(true);
            }
          } else if (act === 'flag') {
            const flag = (body.querySelector('input').value || '').trim();
            if (!flag) { fb.className = 'fb bad'; fb.textContent = 'Paste a flag, or press Done.'; return; }
            if (await doneChallenge(ch.id, flag, fb)) {
              wrap.classList.add('solved');
              await load(true);
            }
          } else if (act === 'hint') {
            await hintChallenge(ch.id, body.querySelector('#hints-' + CSS.escape(ch.id)));
          }
        } catch (err) {
          fb.className = 'fb bad';
          fb.textContent = err.message || String(err);
        }
      });
      wrap.appendChild(head);
      wrap.appendChild(body);
      return wrap;
    }

    async function openDojo(id, keep) {
      const d = await api('/api/dojos/' + encodeURIComponent(id));
      document.getElementById('dhero').innerHTML = `
        <img src="/icons/${BELT[d.belt] || 'belt-white'}.png" alt=""/>
        <div>
          <h1>${esc(d.title)}</h1>
          <p>${esc(d.belt_label || '')} · ${d.solved}/${d.challenges}${d.locked ? ' · locked' : ''}</p>
        </div>
      `;
      const root = document.getElementById('clist');
      root.innerHTML = '';
      const focus = (nextCh && nextCh.dojo_id === id) ? nextCh.id : d.next_challenge_id;
      (d.modules_detail || []).forEach(mod => {
        (mod.challenges || []).forEach(ch => {
          root.appendChild(challengeRow(ch, d.locked, ch.id === focus && !ch.solved));
        });
      });
      home.classList.add('hidden');
      detail.classList.remove('hidden');
      if (!keep) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        history.pushState({ view: 'dojo', id }, '', '#dojo/' + id);
        const open = root.querySelector('.crow.open');
        if (open) open.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function showHome() {
      detail.classList.add('hidden');
      home.classList.remove('hidden');
      history.pushState({ view: 'home' }, '', '#');
    }

    async function load(stay) {
      const [status, cat] = await Promise.all([api('/api/status'), api('/api/dojos')]);
      nextCh = cat.next_challenge || null;
      if (nextCh && status.current_challenge_id === nextCh.id) {
        nextCh.started = true;
        nextCh.workspace = status.current_workspace;
      }
      paintNow();
      paintBelts(cat.dojos || [], status.solved, status.total);
      if (stay && !detail.classList.contains('hidden')) {
        const m = (location.hash || '').match(/^#dojo\/(.+)$/);
        if (m) await openDojo(decodeURIComponent(m[1]), true);
      } else if (!stay) {
        const m = (location.hash || '').match(/^#dojo\/(.+)$/);
        if (m) await openDojo(decodeURIComponent(m[1]));
      }
    }

    document.getElementById('btn-back').onclick = showHome;
    document.getElementById('home-link').onclick = (e) => { e.preventDefault(); showHome(); };
    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.view === 'dojo' && e.state.id) openDojo(e.state.id);
      else { detail.classList.add('hidden'); home.classList.remove('hidden'); }
    });
    load().catch(err => toast('Load failed', err.message || String(err), 'bad'));
  </script>
</body>
</html>
